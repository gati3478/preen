# ── Terminal & Compatibility ─────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-kitty:RGB"
set -as terminal-overrides ",xterm-256color:RGB"    # SSH client true color
set -g mouse on
# 10 restates 3.7's shipped default (measured on a scratch server) — kept
# as a pin so an upstream default change cannot re-introduce input delay.
# 0 breaks arrow keys over SSH.
set -sg escape-time 10
set -g history-limit 200000
# TUIs inside tmux (atuin, btop) may request the modifier combos kitty can
# send; off means they cannot even ask. Opt-in per application — zero
# change for programs that don't request it. Adopted 27-08-2026.
set -sg extended-keys on
set -g focus-events on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-passthrough on                          # Kitty graphics/shell integration
# (an `aggressive-resize on` lived here captioned "Size per-client" — deleted
# 27-08-2026: per-client sizing is what the window-size default `latest`
# already delivers; aggressive-resize governs smallest/largest sizing for
# grouped sessions, which nothing here uses.)
set -g display-time 3000
set -ga update-environment "COLORTERM KITTY_PID KITTY_WINDOW_ID"

# Undercurl support (for tools that use styled underlines)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ── Prefix ───────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Key Bindings ─────────────────────────────────────────────────
# vi copy-mode is a DOCUMENTED EXCEPTION to the non-modal criterion
# (preferences.md § How a tool earns the job) — ruled 27-08-2026:
# copy-mode is a transient pager, not text editing; arrows and search work
# in either idiom, and vi adds v/y select-yank on top. Shipped default is
# emacs, so this line is a deliberate deviation, not drift.
setw -g mode-keys vi

# Intuitive splits (open in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane motion and resize are deliberately NOT bound here: tmux already ships
# the guessable keys, and they are the ones a hand reaches for.
#   prefix + arrow          select the pane that way
#   prefix + option+arrow   resize it 5 cells that way
#   prefix + ctrl+left/right   resize it 1 cell (ctrl+up/down is Mission Control)
# Binding letters on top would only add a second, less obvious name for each.

# Copy mode (vi + pbcopy)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# ── Appearance (Gruvbox Dark Hard — exact colors from theme) ─────────────
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1d2021,fg=#928374"

# Session name with Powerline separator (gold on the hard ground)
set -g status-left "#[bg=#fabd2f,fg=#1d2021,bold] #S #[fg=#fabd2f,bg=#1d2021]"
set -g status-left-length 20

# Right: continuum save indicator + time
set -g status-right "#[fg=#b8bb26]#{continuum_status} #[fg=#928374]%H:%M "
set -g status-right-length 20

# Clickable window tabs with Powerline arrows
# Inactive: dark surface, dim text
setw -g window-status-format "#[fg=#3c3836,bg=#1d2021]#[fg=#928374,bg=#3c3836] #I:#W #[fg=#3c3836,bg=#1d2021]"
# Active: aqua surface, dark text (matches Kitty active tab)
setw -g window-status-current-format "#[fg=#8ec07c,bg=#1d2021]#[fg=#1d2021,bg=#8ec07c,bold] #I:#W #[fg=#8ec07c,bg=#1d2021]"
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#8ec07c"

# Messages
set -g message-style "bg=#3c3836,fg=#ebdbb2"
set -g message-command-style "bg=#3c3836,fg=#ebdbb2"

# Auto-rename windows to current directory basename
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# Kitty title bar shows useful info (replaces tab title template)
set -g set-titles on
set -g set-titles-string "#S:#W — #{pane_current_path}"

# (a "Reduce noise" pair — monitor-activity off, visual-activity off —
# lived here until 27-08-2026: both restate shipped defaults and changed
# nothing; the same inert-line rule that removed MANROFFOPT from zshrc.)

# ── Plugins ──────────────────────────────────────────────────────
# Pin the install target explicitly so tpm never drifts between
# ~/.tmux/plugins and this XDG location (both existed once; XDG won).
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'

# Session persistence
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Thumbs — quick-copy URLs, paths, git SHAs (prefix+Space → hint letters)
set -g @thumbs-key Space
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-fg-color '#fabd2f'
set -g @thumbs-hint-fg-color '#8ec07c'
set -g @thumbs-bg-color '#1d2021'

# Machine-specific overrides; absent on a fresh clone. Here, not last: the
# last `set` wins, and a plugin reads its options when tpm runs below. -q,
# or a missing file lands an attaching client in view-mode on the error.
source-file -q ~/.config/tmux/local.conf

# Initialize TPM (must be last line). Guarded: without tpm, every config
# reload would fail on this line.
if-shell '[ -x ~/.config/tmux/plugins/tpm/tpm ]' "run '~/.config/tmux/plugins/tpm/tpm'"
