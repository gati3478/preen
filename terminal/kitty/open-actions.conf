# What a click on a hyperlink does. The shell tools write the links — rg with
# --hyperlink-format=kitty (a #line fragment per match), eza with --hyperlink
# (a plain file:// path per entry) — kitty.conf's detect_url_regex makes one
# of a path:line in plain output, and kitty acts on them here. Without this
# file every file:// link falls through to macOS `open`, which picks an
# application by extension and ignores the line. First matching entry wins;
# entries are separated by blank lines. Reference: kitty's open_actions doc.

# A path with a line fragment is a search hit: Zed, at that line.
protocol file
fragment_matches ^[0-9]+$
action launch --type=background zed -- ${FILE_PATH}:${FRAGMENT}

# A directory opens as a new tab there — a tab is named by where it is.
protocol file
mime inode/directory
action launch --type=tab --cwd=${FILE_PATH}

# An extensionless executable — this repo's own bin/ scripts. Python's table
# types them by extension and they have none, so the text rule below can never
# reach them; kitty types them itself. Deliberate trade: this cannot tell a
# shell script from a compiled binary, which the taste would rather leave with
# the platform. A script is the case that happens daily; a misclicked binary
# costs one garbage buffer.
protocol file
mime inode/executable
action launch --type=background zed -- ${FILE_PATH}

# A path:line or path:line:column from plain output: Zed, at that line. The
# matched text is the whole URL, never a file:// one. Zed starts in the
# clicked window's directory, so a relative path lands when the tool printed
# it from there — cargo in the package directory, not a subdirectory, where
# its package-relative path names a file that does not exist. Deliberate
# trade: a host:port such as example.com:443 matches too, with the same
# result.
url ^[\w./-]+\.[A-Za-z]\w*:\d+(:\d+)?$
action launch --type=background --cwd=current zed -- ${URL}

# Any other text file: Zed. mime.types beside this file names the stack's
# extensions Python's table lacks or mislabels; the rest fall to `open`.
# LAST, and that is load-bearing — specifically behind the fragment entry,
# which tests no mime at all: a text file's `#line` link matches both, and
# text-first would open it without its line. The two inode/* entries above are
# disjoint from text/* and their order against it does not matter.
protocol file
mime text/*
action launch --type=background zed -- ${FILE_PATH}
