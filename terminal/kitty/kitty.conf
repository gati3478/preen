# kitty — Gruvbox Dark Hard
#
# This file holds only settings that differ from kitty's defaults.
# The full annotated reference is NOT vendored here: it ships with kitty
# and stays current with the installed version, whereas a copy goes stale.
# Online: https://sw.kovidgoyal.net/kitty/conf/

# ── Font ─────────────────────────────────────────────────
font_family      family="FiraCode Nerd Font Mono"
font_size 16.0
# calt: the ligatures — Fira Code declares no `liga`, so none is named.
# zero: dotted zero. onum: oldstyle figures, on Bold as well: its font
# declares the feature.
font_features FiraCodeNFM-Reg  +calt +zero +onum
font_features FiraCodeNFM-Bold +calt +zero +onum

# ── Cursor ───────────────────────────────────────────────
cursor_shape underline
cursor_underline_thickness 4.0
# The underline in an OS window without focus too; kitty's default draws a
# hollow block.
cursor_shape_unfocused unchanged
# A jump glides: a trail sweeps in from where the caret was, so the eye
# follows it. The value is a dwell in ms at the new cell, so a cursor a TUI
# keeps moving draws none; the threshold skips a move of 4 cells or fewer,
# typing among them; the decay keeps the sweep shorter than kitty's own.
cursor_trail 200
cursor_trail_decay 0.08 0.25
cursor_trail_start_threshold 4

# ── Programs ─────────────────────────────────────────────
# kitty runs the editor a click opens (open-actions.conf) without a shell, so
# Homebrew's bin, where subl lives, is searched here, not through a login
# shell's startup files.
exe_search_path +/opt/homebrew/bin

# ── Scrollback ───────────────────────────────────────────
scrollback_lines 50000
# The pager opens where you were: kitty puts the line number in place of
# INPUT_LINE_NUMBER, and bat hands it to less. Without --pager, bat starts less
# at the oldest line.
scrollback_pager bat --paging=always --style=plain --wrap=never '--pager=less --RAW-CONTROL-CHARS --chop-long-lines +INPUT_LINE_NUMBER'
scrollback_pager_history_size 64
scrollback_fill_enlarged_window yes

# ── Selection ────────────────────────────────────────────
copy_on_select yes
# smart: normal selections drop trailing spaces; rectangular selections keep them.
strip_trailing_spaces smart
# A modifier, not `always`: a URL permanently painted over every hovered
# filename in an `ll` listing is clutter. cmd is free — no default mouse
# action uses it. The address shows
# beside the pointer, where the eye already is.
show_hyperlink_targets cmd
hyperlink_target_position tooltip
# A file reference in plain output — `src/main.rs:42:5` from a compiler or a
# test runner, which write no hyperlinks — is a link too; open-actions.conf
# sends it to Sublime Text at that line. The extension must start with a
# letter, so a `1.2.3.4:22` stays text.
detect_url_regex [[:alnum:]_./-]+\.[[:alpha:]][[:alnum:]]*:[0-9]+(:[0-9]+)?

# ── Bell ─────────────────────────────────────────────────
# The shell never beeps — zsh's NO_BEEP, readline's bell-style, less's -Q —
# and beneath all three, kitty at its default rings for any program that
# writes BEL and is not silenced individually. The signal that remains is the
# tab's bell symbol, in red.
enable_audio_bell no
# A command that ran 30 s or more and ends out of view, in an inactive tab
# or a covered window, rings that bell: silent, so what shows is the tab's
# bell symbol and the Dock badge. A build or a test run reports no program
# status of its own.
notify_on_cmd_finish invisible 30 bell
# The bell's symbol on a tab: a plain Nerd Font glyph like the ones
# tab.program_status draws, in place of kitty's emoji. tab_bar.py colours
# it.
bell_on_tab "  "

# ── Window ───────────────────────────────────────────────
# A window returns where it was quit (the session below saves its geometry);
# one with nothing to restore opens at this size, where remember_window_size
# would give it the size of whichever window closed last. 1300 pt is 129
# columns of kitty's 10 pt cell plus the padding. The height depends on the
# screen, so set yours in local.conf, in rows: `initial_window_height` with a
# `c` suffix.
remember_window_size  no
initial_window_width  1300
initial_window_height 840
# Half a cell between text and the window edge, in points: kitty's cell is
# 10 pt wide at 16 pt.
window_padding_width 5
confirm_os_window_close 2

# ── Tab bar ──────────────────────────────────────────────
# tab_bar.py in kitty's config directory draws the bar, and its opening
# comment describes it: a row of soft pills here, at the bottom; rounded
# cards where local.conf moves the bar to the left edge. A tab is named by
# its index and its directory, the one its shell last reported, with a glyph
# while a program there reports working, blocked on you, done or failed.
tab_bar_style custom
# Air between the pills and the window's edges and text, in points.
tab_bar_margin_width 8
tab_bar_margin_height 6 6

# ── Session persistence ──────────────────────────────────
# kitty's own sessions cover local use; tmux is SSH-only. cmd+q saves the
# session below; a logout, restart or shutdown, which cmd+q never sees, saves
# every window with its scrollback, restored once at the next launch in place
# of startup_session.
startup_session ~/.config/kitty/last-session.kitty
restore_session_after_logout yes

# ── Shell integration ────────────────────────────────────
# no-cursor: kitty draws the underline caret, the shell must not fight it.
shell_integration enabled no-cursor

# ── macOS ────────────────────────────────────────────────
macos_option_as_alt left
macos_show_window_title_in window
# 'background' = the active window's background: the titlebar rides the theme
# ground by reference, so a theme swap carries the chrome with no edit here.
macos_titlebar_color background

# ── Key maps ─────────────────────────────────────────────
# --allow-fallback=shifted,ascii: under a non-Latin layout such as
# Georgian-QWERTY, a key reaches a map through its Latin twin only when the
# map allows `ascii`. Without it, cmd+t runs kitty's own new_tab, which
# does, and cmd+q reaches no map.
# Save before quitting: combine runs the first action inline and defers the
# rest, so the session is on disk before quit is scheduled — and a save that
# fails cancels the quit rather than losing the session silently.
map --allow-fallback=shifted,ascii cmd+q combine : save_as_session --save-only --os-window-geometry ~/.config/kitty/last-session.kitty : quit
# A new tab starts where the current one is; kitty's default new_tab starts at
# its own launch directory. `last_reported`, as in the tab's name: the
# directory the shell last reported, where the command you started was
# started, whatever its children do. cmd+w (close_tab) is the macOS default,
# not repeated.
map --allow-fallback=shifted,ascii cmd+t launch --type=tab --cwd=last_reported
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# ── Theme ────────────────────────────────────────────────
# Relative include — kitty resolves it against THIS file's directory, so
# current-theme.conf must always sit beside it; preen doctor asserts it
# ("kitty theme sits beside kitty.conf").
# current-theme.conf is DELIBERATE: `kitten themes` is the chosen selection
# mechanism and this is the name it writes. The row is copy-mode because a
# themes run rewrites the live file; the palette assertions in
# preferences.toml are what catch a pick off the palette.
include current-theme.conf

# ── Per-machine overrides ────────────────────────────────
# local.conf is the adopter's own, written by no script, and read last so it
# beats the lines above. `globinclude`, not `include`: a glob matching nothing
# is SILENT, while a missing `include` prints "Could not find included config
# file" on every single config load.
globinclude local.conf
