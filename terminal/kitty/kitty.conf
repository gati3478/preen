# kitty — Gruvbox Dark Hard
#
# This file holds only settings that differ from kitty's defaults.
# The full annotated reference is NOT vendored here: it ships with kitty
# and stays current with the installed version, whereas a copy goes stale.
#   /Applications/kitty.app/Contents/Resources/doc/kitty/html/_downloads/\
#     433dadebd0bf504f8b008985378086ce/kitty.conf
# Online: https://sw.kovidgoyal.net/kitty/conf/

# ── Font ─────────────────────────────────────────────────
font_family      family="FiraCode Nerd Font Mono"
font_size 16.0
# calt: the ligatures. zero: slashed zero. onum: oldstyle figures.
#
# ⚠️ Corrected 14-08-2026, both halves measured from the font binaries' GSUB
# feature lists (fontTools), not from documentation:
#   `+liga` was here and was INERT. No Fira Code variant installed — Regular,
#   Bold, Nerd, Nerd Mono, plain — declares a `liga` feature; the programming
#   ligatures are `calt` alone, which upstream confirms (tonsky/FiraCode#854).
#   Control: plenty of other installed fonts DO declare `liga` — the SF family
#   among them — so the probe can see the tag when it is there, and Fira Code's
#   lack of it is real rather than a reader bug. Do not re-add it.
#   (A "45 of 280" here was dropped: reproducing it needs the exact scan — three
#   font directories, non-recursive — and without that the number just looks
#   wrong to the next person who counts differently. The control is the finding,
#   not the tally.)
#   `+onum` was on Regular only. Bold's feature list is byte-identical to
#   Regular's and carries `onum` too, so that was not a capability limit — it
#   was transcribed from kitty's own doc example, which shows exactly this
#   asymmetry (`FiraCode-Retina +zero +onum` / `FiraCode-Bold +zero`). The
#   preference is oldstyle figures, so both faces now get it.
font_features FiraCodeNFM-Reg  +calt +zero +onum
font_features FiraCodeNFM-Bold +calt +zero +onum

# ── Cursor ───────────────────────────────────────────────
cursor_shape underline
cursor_underline_thickness 4.0

# ── Scrollback ───────────────────────────────────────────
scrollback_lines 50000
scrollback_pager bat --paging=always --style=plain --wrap=never
scrollback_pager_history_size 64
scrollback_fill_enlarged_window yes

# ── Selection ────────────────────────────────────────────
copy_on_select yes
# smart: normal selections drop trailing spaces; rectangular selections keep them.
strip_trailing_spaces smart
# A modifier, not `always`: a URL permanently painted over every hovered
# filename in an `ll` listing is the clutter tab_title_max_length exists to
# prevent. cmd is free — no default mouse action uses it.
show_hyperlink_targets cmd

# ── Bell ─────────────────────────────────────────────────
# The shell never beeps — zsh's NO_BEEP, readline's bell-style, less's -Q —
# and beneath all three the terminal still rang for any program that writes
# BEL and was not silenced individually. The signal that remains is the tab
# title's {bell_symbol}, in red.
enable_audio_bell no

# ── Window ───────────────────────────────────────────────
# 1300px at FiraCode 16pt was recorded as 129 columns (06-08-2026). cship's
# `width = 129` is NOT coupled to this: the statusline reads the live tty
# width (and $COLUMNS from Claude Code) and never reaches its `width`
# fallback in a terminal — measured 02-09-2026. Resize freely.
remember_window_size  no
initial_window_width  1300
initial_window_height 840
window_margin_width 0.5
confirm_os_window_close 2

# ── Tab bar ──────────────────────────────────────────────
tab_bar_style powerline
tab_powerline_style slanted
tab_title_max_length 30
# kitty.conf is not shell: this Python expression has no access to $HOME or
# any env var. kitty expands variables only in the options whose own docs say
# so, and this is not one of them — measured, not read: with HOME=/EXPANDED,
# `${HOME}` and `$HOME` both come back through load_config verbatim. So the
# home directory to collapse to '~' has to be a literal, authored for one
# machine.
# For any other home, bootstrap writes the line to tab-title.conf beside this
# file, and it wins through a globinclude at the end; the clone is never
# rewritten.
tab_title_template "{index}: {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.active_wd.replace('/Users/gati3478', '~')}"

# ── Session persistence ──────────────────────────────────
# kitty's own sessions cover local use; tmux is SSH-only (see docs/decisions.md).
startup_session ~/.config/kitty/last-session.kitty

# ── Shell integration ────────────────────────────────────
# no-cursor: kitty draws the underline caret, the shell must not fight it.
shell_integration enabled no-cursor

# ── macOS ────────────────────────────────────────────────
macos_option_as_alt left
macos_show_window_title_in window
# 'background' = the active window's background: the titlebar rides the theme
# ground by reference, so a theme swap carries the chrome with no edit here.
macos_titlebar_color background

# ── Key maps ─────────────────────────────────────────────
# Save before quitting: combine runs the first action inline and defers the
# rest, so the session is on disk before quit is scheduled — and a save that
# fails cancels the quit rather than losing the session silently.
map cmd+q combine : save_as_session --save-only ~/.config/kitty/last-session.kitty : quit
# A new tab starts where the current one is; kitty's default new_tab starts at
# its own launch directory. cmd+w (close_tab) is the macOS default, not repeated.
map cmd+t new_tab_with_cwd
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# ── Theme ────────────────────────────────────────────────
# Relative include — kitty resolves it against THIS file's directory, so
# current-theme.conf must always sit beside it; preen doctor asserts it
# ("kitty theme sits beside kitty.conf").
# current-theme.conf is DELIBERATE (reversed 25-08-2026): `kitten themes` is
# the chosen selection mechanism and this is the name it writes. The row is
# copy-mode — a themes run rewrites the live file, preen pull captures it, and
# the palette assertions in preferences.toml are what catch a pick that
# contradicts preferences.md § Colour.
include current-theme.conf

# ── Per-machine overrides ────────────────────────────────
# The last include wins, so each beats the lines above. tab-title.conf is
# written whole by bootstrap, or by the kitty drop-in in its preen/ directory,
# when the home is not the one authored above. local.conf is the adopter's
# own, written by no script, and last so it beats both. `globinclude`, not
# `include`: a glob matching nothing is SILENT, while a missing `include`
# prints "Could not find included config file" on every single config load.
# Both verified against kitty 0.48.2 with `kitty +runpy` ->
# kitty.config.load_config, 14-09-2026.
globinclude tab-title.conf
globinclude local.conf
