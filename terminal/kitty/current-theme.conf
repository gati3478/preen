# Tab and border colors: hand-tuned (the collection autogenerates this block
# with off-palette values and invites replacing it). Active tab is bright
# aqua, matched by tmux's active window pill. A `kitten themes` run rewrites
# this whole file — preen pull captures it, and EVERY line of this block is
# asserted in preferences.toml since 10-09-2026, so doctor stays red
# until the block is re-applied. Only the accent carriers were guarded before
# that, which left a themes run reviewable as clean while the inactive trio had
# reverted and inverted the emphasis the aqua exists to create.
active_tab_foreground   #1d2021
active_tab_background   #8ec07c
inactive_tab_foreground #928374
inactive_tab_background #3c3836
active_border_color     #8ec07c
inactive_border_color   #3c3836
bell_border_color       #fb4934
