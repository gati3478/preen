# ── tmux key bindings ─────────────────────────────────────────────────────────
# The prefix (above) is this family's gate: every binding here is reached
# through it, so an unasserted prefix would leave all of them green and
# unreachable at once.
#
# What each half of the family does, so neither is read as more than it is:
#   the POSITIVES pin the bindings that are NOT tmux's own answer. Only `|`
#   is a key tmux ships nothing for; the rest override a shipped command with
#   the same action done right — `c` without a cwd, `v` as rectangle-toggle,
#   `r` as refresh-client — and `-` spends delete-buffer to get the mnemonic.
#   Both machines want the same string: the reader rejoins after shlex, so the
#   one file's double quotes and another's single quotes normalise together.
#   the ABSENCES pin the deletion. `want_absent` passes on an unset key, so
#   these read "the file does not bind this stroke to that command" — which is
#   exactly the regression to catch: letters re-added over the shipped arrows,
#   or an arrow rebound to the default it already has, which this file's own
#   header forbids as restating a default. A stroke bound to some THIRD command
#   would slip past; a substring matcher cannot say "is unset".
[pref.tmux_keys]
value = "the shipped keys wherever tmux already ships the guessable one; a letter only where it ships nothing"
why = "prefix+arrow selects a pane and prefix+option+arrow resizes it, on both 3.7c and 3.5a, out of the box. An hjkl/HJKL block restated all of it under vim letters and cost `l` (last-window) and `L` (switch-client -l) doing so; it was also modal idiom outside copy-mode, the only place the non-modal criterion grants an exception. Deleted 09-09-2026. Splits keep `|` and `-` because those are pictures of the divider they make, and tmux's own `%`/`\"` are not."

[pref.tmux_keys.targets.tmux_split_h]
target = "tmux_keys"
key = "prefix/|"
want = "split-window -h -c #{pane_current_path}"

[pref.tmux_keys.targets.tmux_split_v]
target = "tmux_keys"
key = "prefix/-"
want = "split-window -v -c #{pane_current_path}"

[pref.tmux_keys.targets.tmux_new_window]
target = "tmux_keys"
key = "prefix/c"
want = "new-window -c #{pane_current_path}"

[pref.tmux_keys.targets.tmux_no_vim_motion_h]
target = "tmux_keys"
key = "prefix/h"
want_absent = "select-pane"

[pref.tmux_keys.targets.tmux_no_vim_motion_j]
target = "tmux_keys"
key = "prefix/j"
want_absent = "select-pane"

[pref.tmux_keys.targets.tmux_no_vim_motion_k]
target = "tmux_keys"
key = "prefix/k"
want_absent = "select-pane"

# `l` and `L` are the two stock bindings the deleted block was costing, so
# these two rows are the ones that would notice it coming back.
[pref.tmux_keys.targets.tmux_no_vim_motion_l]
target = "tmux_keys"
