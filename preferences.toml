[pref.git_conflicts]
value = "zdiff3 conflict blocks; resolutions remembered"
why = "zdiff3 shows the common ancestor inside the markers, so a conflict reads as two diffs instead of a guess; rerere replays a resolution already made once — proactive assistance, the machine remembers."

[pref.git_conflicts.targets.gitcfg]
key = "merge.conflictstyle"
want = "zdiff3"

[pref.git_conflicts.targets.gitcfg_rerere]
target = "gitcfg"
key = "rerere.enabled"
want = "true"

[pref.git_tidy_remotes]
value = "remotes prune themselves; a first push needs no -u"
why = "fetch.prune drops branches the remote already deleted; push.autoSetupRemote wires the upstream on first push — inventory upkeep the tool owns, not the operator."

[pref.git_tidy_remotes.targets.gitcfg]
key = "fetch.prune"
want = "true"

[pref.git_tidy_remotes.targets.gitcfg_autosetup]
target = "gitcfg"
key = "push.autoSetupRemote"
want = "true"

[pref.git_conventions]
value = "main by default; LF in the repo"
why = "init.defaultBranch names the branch every host expects; autocrlf=input strips CRLF at commit and rewrites nothing at checkout — the correct half-conversion on macOS."

[pref.git_conventions.targets.gitcfg]
key = "init.defaultBranch"
want = "main"

[pref.git_conventions.targets.gitcfg_autocrlf]
target = "gitcfg"
key = "core.autocrlf"
want = "input"

[pref.git_big_repo_status]
value = "status caches the walk; it does not watch the tree"
why = "untrackedCache keeps the win the 28-08-2026 sweep measured (`git status` in the largest repo here, 93.7ms ±1.1 → 26.7ms ±1.0 warm, hyperfine, 10 runs each, both settings adopted together). fsmonitor WITHDRAWN 15-09-2026: a prompt runs git with GIT_OPTIONAL_LOCKS=0, and git will not start the fsmonitor daemon under it — it attempts the IPC handshake, spends 1.088s, and falls back to the ordinary walk, every render, never self-healing, because the prompt is the one caller that cannot start the daemon it needs. Against that, fsmonitor's margin ON TOP of untrackedCache is 34.5ms ±4.0 vs 40.7ms ±1.8 in that repo (hyperfine, 15 runs, daemon warm) — 6ms bought for a 1.088s stall in every repo after every reboot. traps.md § 'A prompt cannot start the fsmonitor daemon' holds the mechanism."

# Absence, not a false: core.fsmonitor unset IS git's default, and this config
# holds only non-defaults. want_absent therefore reads the FILE for the key
# coming back, in the spelling this repo writes. The other spellings and every
# scope the manifest does not own are preen doctor's, which reads git's own
# effective boolean beside this row (source-repo only, mutation-checked on
# `true` and on `yes`, 15-09-2026).
[pref.git_big_repo_status.targets.gitcfg]
key = "core.fsmonitor"
want_absent = "true"

[pref.git_big_repo_status.targets.gitcfg_untracked]
target = "gitcfg"
key = "core.untrackedCache"
want = "true"

[pref.gh_rides_git]
value = "gh follows the choices git already made"
why = "pager=delta so `gh pr diff` reads like `git diff` (non-diff gh output passes through delta unchanged — measured 28-08-2026); git_protocol ssh at BOTH layers, because hosts.yml overrides config.yml per host and the two disagreed silently until the same day (file said https, effective was ssh)."

[pref.gh_rides_git.targets.gh_telemetry]
target = "gh"
key = "telemetry"
want = "disabled"

[pref.gh_rides_git.targets.gh]
key = "pager"
want = "delta"

[pref.gh_rides_git.targets.gh_protocol]
target = "gh"
key = "git_protocol"
want = "ssh"

[pref.update_signal]
value = "each tool's own update check stays on"
why = "A version bump is what re-enters a closed surface (§ Obsidian, Re-entry; § Interaction for kitty, § Shell for atuin), so the check that produces the signal is a gate on re-entry itself. Kept-on was prose only until 05-09-2026, when the same pass found that a recorded state nothing asserts is a wish. Obsidian writes updateDisabled only when its check is switched off, and its plugins' startup check is a live flag; kitty's interval and atuin's toggle are switched off by one line each, and text asserts that no line does."

# update_check_interval is in hours and 0 disables. This was want_absent "0"
# until 10-09-2026, with its own comment conceding that a substring test over a
# number would also trip on 10 or 240. The preference § Interaction states is
# the 24-hour check, so the row now says that, exactly, and reads kitty's own
# default for the key the config leaves unwritten — which is the whole point
# here: this notice IS the re-entry signal for the kitty surface, so an upstream
# default of 0 would retire the signal with nothing to notice.
[pref.update_signal.targets.kitty]
key = "update_check_interval"
want = "24"
unset_reads_default = true

[pref.update_signal.targets.atuin]
key = "update_check"
want_absent = "false"


