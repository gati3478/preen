# The taste, as assertions — the half of the preference spec that names no
# host of its own. A host's own file (hosts/<name>/preferences.toml: its targets,
# their rows, its installed-version table) is merged onto this one at load
# time, and a key defined in two files is refused, never overridden. The
# prose half, preferences.md, is not published: without it the ceiling
# cross-check is skipped with one warn, and every row below still runs.
#
# `preferences.md` is the authority and carries the reasoning. This file carries
# only what a check can act on, and `bin/lib/pref-check.py` asserts it against
# LIVE config — not against the copies in this repo, because a `copy`-mode entry
# can be legitimately stale between `preen pull` runs and the question is what the
# application actually renders.
#
# "Live config" means the whole config an application assembles, not one file:
# the kitty reader follows `include`/`globinclude` inline, the way kitty does.
# Every `unreachable` entry below must also appear in preferences.md's ceiling
# table, and vice versa — the two lists are compared on every run.
#
# ── The state field declares INTENT, never outcome ─────────────────────────────
# An earlier draft of the design had four states, two of which (`holds`,
# `drift`) were outcomes of running the check. Those cannot be declared: writing
# "this holds" into the SSOT means hand-editing it every time a config changes,
# which is the maintenance burden the mechanism exists to remove. Three states:
#
#   enforce      compare live value against `want` -> ok / FAIL. The default:
#                a row that writes no `state` is enforced.
#   unreachable  the application cannot do this. Never compared. With
#                recheck = "auto" the ceiling is RE-PROVEN from data the app
#                ships, so if it ever lifts, the check says so.
#   n_a          does not apply to this surface. Silent.
#
# Matchers:
#
#   want_all_contain  every entry must contain this. Pair with `accumulate`
#                     for a kitty directive that accumulates (font_features,
#                     map, symbol_map, env, modify_font among others) — without
#                     it only the LAST line is read, which silently checks the
#                     wrong one.
#   want_any_contain  at least ONE entry must contain this — the dual, for a
#                     preference living on one line of an accumulating
#                     directive (a `map` among many). Same accumulate caveat.
#   want_any          at least ONE entry must EQUAL this (trimmed). For lists
#                     whose entries are whole names or whole lines — a
#                     function name, a probe's `key=value` line — where a
#                     substring cannot tell `_fzf_compgen_path` from
#                     `_fzf_compgen_pathX`, nor a main-keymap binding from a
#                     menuselect line repeating its text (both survived the
#                     02-09-2026 battery under want_any_contain).
#   want_absent       the value must NOT contain this, CASE-INSENSITIVELY. For
#                     preferences a tool expresses by NEGATION — Sublime's
#                     ligatures are on by default and switched off by
#                     no_liga/no_clig/no_calt. An ABSENT key passes: deleting
#                     the setting satisfies it. Case-folded since 10-09-2026:
#                     kitty lowercases a mouse_map's modes before matching them,
#                     so `UNGRABBED` unbound the click past an exact-case test.
#   want_contains     substring test.
#   want              exact, string-compared after trimming — unless the want
#                     itself carries leading or trailing whitespace, when it is
#                     compared whitespace-exact against the raw read: starship's
#                     one-space fill symbol, and the separator space that ends a
#                     module format (both audits, 16-09-2026).
#
# Every matcher takes a QUOTED string. `want = 16` is rejected rather than
# silently never matching, because reads are normalised to strings.
#
# ── unset_reads_default: how to assert a value the config must NOT carry ──────
# Some preferences ARE the application's default, and a config that holds only
# non-defaults therefore must not name them. Stating those as `want_absent` on
# the disabling spelling is the trap: an absent key passes whatever the
# application would do with it, so the row is green in two very different
# worlds — the default is right, or the default moved and the preference is
# gone. It is also only as tight as the spellings you thought of, and a
# substring test over an un-lowercased read is not tight at all.
# `unset_reads_default = true` resolves an absent key to the value the
# application's OWN shipped documentation gives, and hands that to the ordinary
# matcher. The row becomes a positive statement, an upstream default flip fails
# it, and every written spelling is judged on the same terms. It is accepted
# only on a format in DEFAULT_ORACLES — without an oracle the flag would
# quietly mean "absent always passes", which is the hole it exists to close —
# and only where the shipped default is a VALUE: a valueless `# key` line
# (the accumulating directives, and scalars whose default is empty) is refused
# at run time, because "" satisfies want_absent and that is the same hole.
#
# ── A line that restates a shipped default is not a preference ─────────────────
# It buys nothing and costs a line, and it hides the one thing a config should
# show: what was CHOSEN. Both governed tmux.conf files say so in their own
# headers, and the tmux_keys rows below assert it for the keys tmux already
# binds well — a `bind Left select-pane -L` would be exactly this mistake.

# ── Where each surface's live config lives ─────────────────────────────────────

[targets.kitty]
format = "kitty"
path = "~/.config/kitty/kitty.conf"

# Two more files kitty reads beside kitty.conf, both link rows since
# 06-09-2026 (the zsh+kitty seam pass). Same `key value` grammar, no
# includes. kitty stats open-actions.conf on every click, so an edit is live
# at once; mime.types is read once per process and needs a config reload.
# open-actions.conf is read as ORDERED ENTRIES, not as an option stream. It
# shares kitty.conf's `key value` grammar, so the plain kitty reader parses it
# — and did, until 10-09-2026 — but that reader flattens the file and this
# file's meaning is not flat: kitty takes the first entry whose criteria ALL
# match, and an entry's `action` belongs to the criteria above it. Flattened,
# the directives are a bag. Keys are `block1`, `block2`, … in file order.
[targets.kitty_open_action_blocks]
format = "kittyblocks"
path = "~/.config/kitty/open-actions.conf"

[targets.kitty_mime_types]
format = "kitty"
path = "~/.config/kitty/mime.types"

# The one adopted kitten's own config, a link row since 10-09-2026. Same
# `key value` grammar again; `ignore` accumulates.
[targets.kitty_choose_files]
format = "kitty"
path = "~/.config/kitty/choose-files.conf"

# The two prompt surfaces. cship renders its first line by INVOKING Starship per
# module, so a module's look edited in starship.toml reshapes the Claude Code
# statusline too — but WHICH modules appear is cship's own list, never read
# from starship's format (pref.prompt_curated pins both copies).
[targets.starship]
format = "toml"
path = "~/.config/starship.toml"

[targets.cship]
format = "toml"
path = "~/.config/cship.toml"

# The SSH-side terminal. Unlike the prompts it paints its own ground, so it is
# the one surface here that can carry all three of the identity hexes.
[targets.tmux]
format = "tmux"
path = "~/.config/tmux/tmux.conf"

# The same file read as a KEY TABLE rather than an option stream. Two readers
# over one path because the two grammars share nothing: `set -g k v` is a
# key/value pair, `bind -T tbl key command…` is not, and read_tmux skips every
# command that is not a `set`. Keys here are `TABLE/KEYSTROKE`.
[targets.tmux_keys]
format = "tmuxbind"
path = "~/.config/tmux/tmux.conf"

# bat's config is one command-line flag per line; the `flags` reader parses it
# the way bat itself does (quotes stripped, last occurrence wins — measured).
[targets.bat]
format = "flags"
path = "~/.config/bat/config"

# ripgrep's config — the file RIPGREP_CONFIG_PATH names. One shell argument
# per line, read by a reader measured against rg 15.2.0 (see read_rgconf:
# quotes poison, space-form errors, --no- negates). The zshenv export is
# asserted under pref.search_scope — without it this whole file is dead
# text and every entry here would go green about a file nothing reads.
[targets.ripgrep]
format = "rgconf"
path = "~/.config/ripgrep/config"

# ncdu's config — one option per line, argument ON the line. A malformed
# config is refused loudly (exit 1), so the reader's real job is the
# valid-but-wrong value: `--color off` loads fine and is still drift
# (see read_ncduconf, measured against 2.9.2).
[targets.ncdu]
format = "ncduconf"
path = "~/.config/ncdu/config"

[targets.zed]
format = "jsonc"
path = "~/.config/zed/settings.json"

[targets.sublime]
format = "jsonc"
path = "~/Library/Application Support/Sublime Text/Packages/User/Preferences.sublime-settings"

[targets.sublime_terminus]
format = "jsonc"
path = "~/Library/Application Support/Sublime Text/Packages/User/Terminus.sublime-settings"

[targets.sublime_terminus_view]
format = "jsonc"
path = "~/Library/Application Support/Sublime Text/Packages/User/Terminus View.sublime-settings"

# The three zsh startup files — the text half of the shell surface. All
# link-mode, so deployed and repo are one file; the reader still reads the
# deployed path like every other target.
[targets.zshrc]
format = "zsh"
path = "~/.zshrc"

[targets.zshenv]
format = "zsh"
path = "~/.zshenv"

[targets.zprofile]
format = "zsh"
path = "~/.zprofile"

# The live half: one isolated PTY zsh per doctor run (env -i, ESC-guarded —
# see read_zshcap). It measures the shell's END STATE after every eval-time
# init and .local overlay — the half a text reader structurally cannot see.
[targets.zsh_live]
format = "zshcap"
path = "~/.zshrc"

# Managed since 27-08-2026 (the 18.19 sweep's adoptions ended the
# no-managed-config settlement). link-mode: atuin writes this file once, at
# first run, and never again — the live mtime sat at its 14-08 creation
# through daily use to 27-08.
# Readline's rc on the Mac — Apple's /bin/bash by name, Homebrew's gpg, and
# mise's python REPL (its readline module links libreadline.8; python@3.14's
# links libedit, so that REPL never reads this file, and neither does sqlite3:
# Homebrew's is keg-only, so a shell reaches Apple's libedit build). Same
# `set NAME VALUE` grammar the nanorc reader already parses. No `$if` block and
# no binding, by design.
[targets.inputrc]
format = "nanorc"
path = "~/.inputrc"

[targets.atuin]
format = "toml"
path = "~/.config/atuin/config.toml"

# The git surface, read by git's own parser (--file --includes — see
# read_gitcfg). gitcfg is the global file plus its include chain; with no
# repository in play the conditional include contributes nothing, so this
# target resolves the PERSONAL identity. The work overlay is asserted
# against its own file below — the directory flip itself was proven live
# 28-08-2026 with a probe repo under the includeIf path, the clean shape:
# a work clone carrying its own local user.email shadows the overlay,
# and one without resolves through it (both kinds exist live).
[targets.gitcfg]
path = "~/.gitconfig"
format = "gitcfg"

[targets.gh]
path = "~/.config/gh/config.yml"
format = "ghcfg"

# The ssh CLIENT config, answered through `ssh -G` per host — the resolved
# state, after Host matching and unit normalisation (10m arrives as 600).
[targets.ssh]
path = "~/.ssh/config"
format = "sshcfg"

# Terminus's colour scheme — the second terminal surface. BOTH
# Terminus.hidden-color-scheme files are build artifacts, generated from
# `user_theme_colors` in Terminus.sublime-settings (see the traps.md entry).
# The repo copy of the small one is pinned generated bytes, so a legitimate
# regeneration is a no-op diff.
[targets.sublime_terminus_scheme]
format = "jsonc"
path = "~/Library/Application Support/Sublime Text/Packages/User/Terminus/Terminus.hidden-color-scheme"

# ── Caret ──────────────────────────────────────────────────────────────────────

[pref.caret]
value = "underline"
why = "A block hides the character it sits on; a thin bar disappears."

[pref.caret.targets.kitty]
key = "cursor_shape"
want = "underline"

# The thickness half of "underline caret, 4pt thick" (preferences.md § Cursor).
[pref.caret.targets.kitty_thickness]
target = "kitty"
key = "cursor_underline_thickness"
want = "4"

[pref.caret.targets.zed]
key = "cursor_shape"
want = "underline"

[pref.caret.targets.zed_terminal]
target = "zed"
key = "terminal.cursor_shape"
want = "underline"

[pref.caret.targets.sublime]
state = "unreachable"
recheck = "auto"
evidence = "caret_style accepts smooth|phase|blink|solid plus a block_caret bool"
probe = "sublime_caret_styles"

# ── Typeface ───────────────────────────────────────────────────────────────────

[pref.nerd_font_where_glyphs_render]
value = "FiraCode Nerd Font Mono"
why = "Nerd glyphs render in terminals, statuslines and file-tree icons. 'Fira Code' and 'FiraCode Nerd Font Mono' are separate installed families; the wrong one produces tofu rather than an error."

# EXACT, since 10-09-2026, and the substring it replaced is the more
# interesting half of the story. `want_contains` catches the tofu hazard the
# `why` names — plain `Fira Code` is a different installed family — but four
# OTHER installed families contain the wanted string as a strict PREFIX:
# "… Light", "… Med", "… Ret", "… SemBd" (read from name ID 1 of every file in
# the three font directories). Each carries its own PostScript name, and the
# two font_features lines below index BY PostScript name — so a drift to a
# sibling weight left `+calt +zero +onum` naming a face that was not in use,
# with pref.ligatures and pref.figure_features both green and no tofu to
# notice. That is the 14-08-2026 `+liga` defect rebuilt with the assertions in
# place. The realistic writer is not a hand-edit: `kitten choose-fonts` writes
# an extended spec back into kitty.conf, and `family="…" style=Retina` passes a
# substring test.
# The trade: this row is now coupled to kitty's font-spec syntax, so any
# rewrite of the line turns it red even when equivalent. That red IS the event
# — the kitten rewriting a link-mode managed file is the drift. Teaching the
# reader to parse the spec and return the family alone was considered and is
# strictly worse: `family="FiraCode Nerd Font Mono" style=Retina` would read
# back as the wanted family and go green on exactly this drift.
[pref.nerd_font_where_glyphs_render.targets.kitty]
key = "font_family"
want = 'family="FiraCode Nerd Font Mono"'

# The faces the features lines name, asserted where the FAMILY is — because
# that is the fact they depend on. The three font_features rows under
# pref.ligatures and pref.figure_features check what every line SAYS; nothing
# checked which faces were covered, so deleting one line left them green with
# half the terminal unstyled. Substring-safe: the sibling PostScript names are
# -Light/-Med/-Ret/-SemBd, and -Reg and -Ret differ in their last character.
[pref.nerd_font_where_glyphs_render.targets.kitty_features_regular]
target = "kitty"
key = "font_features"
accumulate = true
want_any_contain = "FiraCodeNFM-Reg"

[pref.nerd_font_where_glyphs_render.targets.kitty_features_bold]
target = "kitty"
key = "font_features"
accumulate = true
want_any_contain = "FiraCodeNFM-Bold"

[pref.nerd_font_where_glyphs_render.targets.zed_terminal]
target = "zed"
key = "terminal.font_family"
want = "FiraCode Nerd Font Mono"

[pref.nerd_font_where_glyphs_render.targets.sublime_terminus]
key = "view_settings.font_face"
want = "FiraCode Nerd Font Mono"

# Terminus requires the font in BOTH files. Its own settings file calls setting
# only one of the two "the failure mode" — and until 14-08-2026 that was the one
# thing the spec did not check.
[pref.nerd_font_where_glyphs_render.targets.sublime_terminus_view]
key = "font_face"
want = "FiraCode Nerd Font Mono"

[pref.nerd_font_where_glyphs_render.targets.zed]
state = "n_a"
evidence = "editor buffer renders no Nerd glyphs; plain Fira Code is correct there — asserted separately by [pref.editor_typeface]"

# ── Typeface where NO glyphs render ────────────────────────────────────────────
# preferences.md makes the family the most emphasised typography preference and
# warns the wrong one "produces tofu rather than an error" — and until
# 14-08-2026 not one editor BUFFER surface asserted it. The block above covers
# the terminals; this covers the four surfaces that render no Nerd glyphs and so
# want plain `Fira Code`, which is a SEPARATE installed family from
# `FiraCode Nerd Font Mono` rather than another name for it.

[pref.editor_typeface]
value = "Fira Code"
why = "An editor buffer renders no Nerd glyphs, so the plain family is correct there. Setting the Nerd variant instead is not an error either — it just renders, slightly differently, forever."

[pref.editor_typeface.targets.zed]
key = "buffer_font_family"
want = "Fira Code"

[pref.editor_typeface.targets.sublime]
key = "font_face"
want = "Fira Code"

# ── Size (this machine — see preferences.md for the per-device rule) ───────────

[pref.font_size_mac]
value = "16"
why = "~50 rows on a 14in Retina panel means no TUI-grid ceiling pressure, so the size is chosen purely for comfort. Other devices resolve the same rule to different numbers."

[pref.font_size_mac.targets.kitty]
key = "font_size"
want = "16"

[pref.font_size_mac.targets.zed]
key = "buffer_font_size"
want = "16"

[pref.font_size_mac.targets.zed_terminal]
target = "zed"
key = "terminal.font_size"
want = "16"

[pref.font_size_mac.targets.sublime]
key = "font_size"
want = "16"

# ── Rulers / visual guides ─────────────────────────────────────────────────────

[pref.rulers]
value = "80, 100, 120"
why = "Visual guides are load-bearing, not decoration — the same instinct as a rule-of-thirds grid in a camera app."

[pref.rulers.targets.sublime]
key = "rulers"
want = "80,100,120"

[pref.rulers.targets.zed]
key = "wrap_guides"
want = "80,100,120"

[pref.copy_on_select]
value = "on, and a double-click takes a path whole"
why = "Selecting is the copy."

[pref.copy_on_select.targets.kitty]
key = "copy_on_select"
want = "yes"

# Copies drop trailing spaces; smart leaves rectangular selections intact.
# Adopted 26-08-2026 from the 0.48.2 reference sweep.
# A double-click takes a path WHOLE — `alpha_beta`, `foo.bar`, `/a/b/c` — which
# is kitty's shipped set and is kept by ruling, 10-09-2026. It contradicts the
# SSH side on purpose: tmux's `word-separators` was aligned to the prompt's
# empty WORDCHARS the day before, so the same gesture stops at every separator
# there. Selection and motion are different jobs. You double-click a path to
# copy it, so whole is the useful answer; you option+arrow through a path to
# edit it, so segments are the useful answer there. Pinned because an unruled
# shipped default that contradicts a ruling is what a later cleanup "fixes".
[pref.copy_on_select.targets.kitty_word_selection]
target = "kitty"
key = "select_by_word_characters"
want = "@-./_~?&=%+#"
unset_reads_default = true

[pref.copy_on_select.targets.kitty_strip_trailing]
target = "kitty"
key = "strip_trailing_spaces"
want = "smart"

[pref.copy_on_select.targets.zed_terminal]
target = "zed"
key = "terminal.copy_on_select"
want = "true"

[pref.copy_on_select.targets.sublime_terminus]
state = "unreachable"
recheck = "manual"
evidence = "Terminus does not implement copy-on-select — absent from its source, not merely from its defaults"

# The SSH half: MouseDragEnd1Pane pipes the selection to pbcopy. `mouse on` is
# the gate — without it there is no drag to copy from — so it carries the teeth
# here; the bind line itself is asserted by pref.tmux_keys through the binding
# reader, which did not exist when this row was written.
[pref.copy_on_select.targets.tmux]
key = "mouse"
want = "on"

# The trailing-space half of the taste stops at the tmux border: copy-mode
# has no strip option, and the smart rectangular exception would need a
# rectangle_toggle format conditional — a contraption, not a setting.
[pref.copy_on_select.targets.tmux_trailing]
state = "unreachable"
recheck = "manual"
target = "tmux"
evidence = "man tmux 3.7c: no trailing-space option exists in copy-mode; only capture-pane's -N/-J flags speak to trailing spaces, and neither reaches the mouse-drag copy path"

[pref.ligatures]
value = "on"
why = "-> and => and !== read as the single operators they are."

# `calt` is the WHOLE mechanism for this font, not half of it. No installed Fira
# Code variant declares a `liga` feature, so the `+liga` kitty.conf carried until
# 14-08-2026 asserted nothing — which is why nothing here ever checked for it.
[pref.ligatures.targets.kitty]
key = "font_features"
accumulate = true
want_all_contain = "+calt"

# Sublime states this NEGATIVELY: liga/clig/calt are on by default and are
# switched off by no_liga/no_clig/no_calt. This asserted `dlig` until
# 14-08-2026 — a different, optional feature — so adding "no_liga" would have
# turned the stated preference off while the check stayed green.
[pref.ligatures.targets.sublime]
key = "font_options"
want_absent = "no_calt"

# ── Whitespace rendering (NOT whitespace policy — that is .editorconfig's) ─────

[pref.whitespace_rendering]
value = "boundaries shown, inter-word spaces not"
why = "Leading indentation, trailing space, tabs and whitespace-only lines. Single spaces between words are noise."

[pref.whitespace_rendering.targets.zed]
key = "show_whitespaces"
want = "boundary"

[pref.whitespace_rendering.targets.sublime]
key = "draw_white_space"
want = "leading,trailing,isolated,all_tabs"

[pref.figure_features]
value = "zero (slashed), onum (oldstyle)"
why = "0 and O should never be a guess; oldstyle figures sit better in running text."

[pref.figure_features.targets.kitty]
key = "font_features"
accumulate = true
want_all_contain = "+zero"

# Symmetric with `+zero` above as of 14-08-2026. This used to assert only that
# SOME face carried `+onum`, because Bold lacked it and nothing recorded why.
# The font binaries settled it: Bold's GSUB feature list is byte-identical to
# Regular's, so the omission was transcribed from kitty's own doc example, not
# forced by the face. Both faces carry it now, so the weaker matcher is gone —
# the evidence is in kitty.conf's `# ── Font ──` section.
[pref.figure_features.targets.kitty_onum]
target = "kitty"
key = "font_features"
accumulate = true
want_all_contain = "+onum"

[pref.figure_features.targets.sublime]
state = "unreachable"
recheck = "manual"
evidence = "font_options takes the ligature toggles and ss01-ss10 only, not arbitrary OpenType tags"

[pref.figure_features.targets.zed]
state = "unreachable"
recheck = "manual"
evidence = "buffer_font_features exposes named features, but zero/onum are not wired to Fira Code's tables here — re-check when Zed's font_features docs change"

# ── Knowing which construct the caret is inside ────────────────────────────────

[pref.enclosing_context]
value = "some marker of the enclosing construct"
why = "IDEA draws method separators; Zed has no equivalent and solves it from the other end with sticky scroll."

[pref.enclosing_context.targets.zed]
key = "sticky_scroll.enabled"
want = "true"

# The PREFERENCE is met on Zed, by sticky scroll above. What is unreachable is
# the specific mechanism IDEA uses, and preferences.md listed that ceiling while
# nothing here carried it — so it was outside the "if one ever lifts, it is
# noticed" promise. Listed now, which is also what makes the two lists
# comparable: every row of that table is one entry here, and vice versa.
[pref.enclosing_context.targets.zed_method_separators]
state = "unreachable"
recheck = "manual"
target = "zed"
evidence = "Zed draws no horizontal rule between functions and offers no setting for one; sticky_scroll solves the same problem from the other end and is asserted above"

[pref.terminal_palette]
value = "Gruvbox Dark Hard"
why = "The Mac terminal's identity: dark where code runs, light where it is read, hard for contrast. Settled 25-08-2026 over a same-day Gruvbox Material trial on measured contrast (fg 11.95:1 vs 9.07:1, accent range 4.90 vs 2.24) and family consistency. The three asserted hexes are the ones preferences.md § Colour names."

[pref.terminal_palette.targets.kitty]
key = "background"
want = "#1d2021"

# Aqua rides the bright-cyan slot (and the active tab and border); gold rides
# bright yellow. The ANSI slots are how running programs deliver the accents.
[pref.terminal_palette.targets.kitty_aqua]
target = "kitty"
key = "color14"
want = "#8ec07c"

[pref.terminal_palette.targets.kitty_gold]
target = "kitty"
key = "color11"
want = "#fabd2f"

# The hand-tuned tab/border block in current-theme.conf is the part a
# `kitten themes` run destroys: the collection's autogenerated replacement
# puts the palette's own selection orange (#d65d0e) on the active tab —
# off-ACCENT — plus two hexes from no Gruvbox palette (#eeeeee/#171a1a),
# and carries NO border
# directives, so active_border_color reverts to kitty's default #00ff00 —
# measured 26-08-2026 against the collection's own --dump-theme. The manifest
# copy-row check sees the rewrite, but its remedy (preen pull) then captures the
# loss into the repo with every palette assertion still green. These two pin
# the accent carriers — the same aqua tmux's active-window pill asserts.
[pref.terminal_palette.targets.kitty_active_tab]
target = "kitty"
key = "active_tab_background"
want = "#8ec07c"

[pref.terminal_palette.targets.kitty_active_border]
target = "kitty"
key = "active_border_color"
want = "#8ec07c"

# The rest of current-theme.conf's hand-tuned tab/border block, asserted
# 10-09-2026. The 26-08-2026 ruling pinned the two accent CARRIERS, and its own
# argument reaches the rest unchanged: this block lives in the one `copy`-mode
# file, a `kitten themes` run rewrites it WHOLESALE, and the file's own comment
# says the collection autogenerates it with off-palette values. Guarding the
# accent carriers alone meant a themes run could be reviewed as clean while the
# emphasis hierarchy the accent exists to create had inverted.
#
# active_tab_foreground is the legibility half of an already-asserted colour —
# asserting the aqua background without the ink on it asserts half a pair. The
# inactive trio is what makes the active tab and border READ as active; upstream
# leaves inactive_border_color at a near-white #cccccc, a bright frame around
# every unfocused split in a dark terminal.
[pref.terminal_palette.targets.kitty_active_tab_fg]
target = "kitty"
key = "active_tab_foreground"
want = "#1d2021"

[pref.terminal_palette.targets.kitty_inactive_tab_fg]
target = "kitty"
key = "inactive_tab_foreground"
want = "#928374"

[pref.terminal_palette.targets.kitty_inactive_tab_bg]
target = "kitty"
key = "inactive_tab_background"
want = "#3c3836"

[pref.terminal_palette.targets.kitty_inactive_border]
target = "kitty"
key = "inactive_border_color"
want = "#3c3836"

# On the block argument alone, NOT because it protects the bell: the audio bell
# was silenced 10-09-2026 and this is not what replaced it — bell_border_color
# tints the border of INACTIVE windows, which kitty draws only when more than
# one is visible, so it never renders in a one-window-per-tab layout. The bell's
# live signal is the tab title's {bell_symbol}.
[pref.terminal_palette.targets.kitty_bell_border]
target = "kitty"
key = "bell_border_color"
want = "#fb4934"

# The hex § Colour's contrast measurement was actually taken on — fg 11.95:1
# against the ground, the number that decided Gruvbox Dark Hard over a same-day
# Material trial — and the half nothing read.
[pref.terminal_palette.targets.kitty_foreground]
target = "kitty"
key = "foreground"
want = "#ebdbb2"

# The titlebar rides the ground BY REFERENCE — `background` is kitty for "the
# active window's background colour" — so a theme swap recolours the chrome
# with no second copy of the hex anywhere. Adopted 26-08-2026.
[pref.terminal_palette.targets.kitty_titlebar]
target = "kitty"
key = "macos_titlebar_color"
want = "background"

# Terminus is a terminal too — dark where code runs, even inside a light
# editor (flipped 25-08-2026). Same identity trio, read from its GENERATED
# scheme. The generator bumps variables.background one blue step (#1d2022 —
# Sublime's add_regions inversion workaround), so the ground is asserted on
# globals.background and on the source dict below; gold and aqua ride the
# bright-tier variables (light_brown / light_cyan), which pass through
# unchanged.
[pref.terminal_palette.targets.sublime_terminus_scheme]
key = "globals.background"
want = "#1d2021"

[pref.terminal_palette.targets.terminus_gold]
target = "sublime_terminus_scheme"
key = "variables.light_brown"
want = "#fabd2f"

[pref.terminal_palette.targets.terminus_aqua]
target = "sublime_terminus_scheme"
key = "variables.light_cyan"
want = "#8ec07c"

[pref.terminal_palette.targets.terminus_palette_source]
target = "sublime_terminus"
key = "user_theme_colors.background"
want = "#1d2021"

# The prompts. Neither paints a ground — kitty owns it — so each declares that
# with an n_a entry below rather than in a comment somebody has to keep true.
# The two accents per file sit in different modules deliberately: a sentinel
# sharing a table with its sibling stays green through a re-theme that misses
# everything but that table. Values are style strings ("bold #fabd2f"), so these
# match on the hex and survive a weight change rather than failing on one.
#
# ⚠️ These are NOT all always-rendered, and this comment claimed they were until
# 25-08-2026. `starship_gold` (show_always = true) and `cship_aqua` (the context
# bar's base style) are. `starship_aqua` paints only inside a git repo, and
# `cship_gold` only above usage_limits' 70% warn threshold — because those files
# use that accent NOWHERE else: aqua appears exactly once in starship.toml, and
# every gold in cship.toml is a warn tier, an effort tier, or the account label.
# The picks are the only ones available; the claim was the error. The account
# module stopped being that last exception on 11-09-2026: gold there is the same
# rule as starship's $username — gold marks whose session this is.

[pref.terminal_palette.targets.starship_ground]
state = "n_a"
target = "starship"
evidence = "a prompt renders into the terminal's background and sets none of its own — no bg key exists in starship.toml; kitty owns the ground"

[pref.terminal_palette.targets.cship_ground]
state = "n_a"
target = "cship"
evidence = "same as starship — the statusline paints no background; kitty owns the ground"

[pref.terminal_palette.targets.starship_gold]
target = "starship"
key = "username.style_user"
want_contains = "#fabd2f"

[pref.terminal_palette.targets.starship_aqua]
target = "starship"
key = "git_branch.style"
want_contains = "#8ec07c"

[pref.terminal_palette.targets.cship_gold]
target = "cship"
key = "cship.usage_limits.warn_style"
want_contains = "#fabd2f"

[pref.terminal_palette.targets.cship_aqua]
target = "cship"
key = "cship.context_bar.style"
want_contains = "#8ec07c"

# tmux, the SSH-side terminal — the third surface preferences.md § Colour names.
# It draws its own status bar, so all three identity hexes land here: the ground
# on the bar itself, gold on the session pill, aqua on the active-window pill
# (which is deliberately the same aqua as kitty's active tab). Three separate
# directives, two of them `set` and one `setw`, so no single edit can carry all
# three green past a partial re-theme.
[pref.terminal_palette.targets.tmux]
key = "status-style"
want_contains = "#1d2021"

# ⚠️ The accents are anchored to `bg=`, not to the bare hex, and that is not
# cosmetic. Both values carry their accent more than once — status-left as the
# session pill's fill and again as the powerline separator's foreground,
# window-status-current-format likewise — and `want_contains` is satisfied by
# ANY occurrence. Verified 25-08-2026 by recolouring ONLY the pill fills, which
# are the elements actually on screen: both bare-hex assertions stayed green
# while the bar visibly changed. `bg=` pins the fill.
# Residual limit, stated rather than hidden: a re-theme touching only a
# separator's `fg=` still passes. No matcher here can say "every occurrence".
[pref.terminal_palette.targets.tmux_gold]
target = "tmux"
key = "status-left"
want_contains = "bg=#fabd2f"

[pref.terminal_palette.targets.tmux_aqua]
target = "tmux"
key = "window-status-current-format"
want_contains = "bg=#8ec07c"

# ── Editor theme ───────────────────────────────────────────────────────────────

[pref.editor_theme]
value = "Gruvbox Light Hard"
why = "Light where code is read, hard for contrast — standing since 25-08-2026. IDEA is the deliberate exception: its theme is an executable plugin, where upstream maintenance IS load-bearing, so it runs a Gruvbox Material Light Island variant instead. Which variant is the idea_laf/idea_colors `want` below and is not restated here — this line named one until 07-09-2026 and was stale the moment the theme moved."

[pref.editor_theme.targets.zed]
key = "theme.light"
want = "Gruvbox Light Hard"

# The dark half of Zed's mode pair stays in-family and hard.
[pref.editor_theme.targets.zed_dark]
target = "zed"
key = "theme.dark"
want = "Gruvbox Dark Hard"

[pref.editor_theme.targets.sublime]
key = "color_scheme"
want_contains = "gruvbox-light-hard"

# ── Surfaces that follow the terminal palette ──────────────────────────────────
# The palette is stated once, in the kitty theme; a surface that can ride the
# 16 ANSI slots does. bat joined 26-08-2026 — it was the one unasserted rider,
# blocked only on a flag-per-line reader, which `flags` now is.

[pref.follow_terminal_palette]
value = "ansi"
why = "A surface that can render in the terminal's own 16 colors should, so a theme swap reaches it with no edit."

[pref.follow_terminal_palette.targets.bat]
key = "theme"
want = "ansi"

# fzf's unconfigured base scheme is a 256-colour palette of its own ("dark"),
# so unlike eza, silence does not comply — the rider must be claimed. Reaches
# zoxide's zi too: the env var passes through to its fzf child unchanged
# (probe-measured 27-08-2026). eza rides by default and is watched
# behaviourally by preen doctor's fixture check instead — its compliant state
# is an absence no text reader can see.
[pref.follow_terminal_palette.targets.fzf]
target = "zshrc"
key = "FZF_DEFAULT_OPTS"
want = "--color=16"

# z-sy-h and zsh-autosuggestions ride by default — every shipped style is a
# named colour or fg=8 (read from the highlighters' sources and the
# plugin's config, 02-09-2026) — the eza shape: a compliant absence no
# text can watch. The live probe lists every style carrying a hex or a
# 256-colour index across ZSH_HIGHLIGHT_STYLES (main's, brackets' and any
# other loaded highlighter's — each sets its defaults at load),
# ZSH_HIGHLIGHT_PATTERNS and the suggestion style; `none` is the only
# passing answer.
[pref.follow_terminal_palette.targets.zsh_live_highlight]
target = "zsh_live"
key = "params"
accumulate = true
want_any = "HL_OFF_PALETTE=none"

# The one shell tool that CANNOT ride the palette. Its ceiling row is in
# preferences.md; the probe watches the half that could mechanically lift.
[pref.follow_terminal_palette.targets.fd]
state = "unreachable"
recheck = "auto"
target = "zshrc"
evidence = "fd 10.5.0 renders in 256 colours and has no route to the terminal's 16: --color takes when-to-colour (auto/always/never), never a depth, and LS_COLORS REPLACES its compiled-in ~250-rule extension table rather than recolouring it — measured 09-09-2026, LS_COLORS=di=34 left .md files with no colour at all where the default gave them 38;5;185"
probe = "fd_colour_modes"

# fp's preview pane, the one surface here that cannot ride the terminal's 16:
# it highlights through the kitten's embedded Chroma styles, so the nearest
# reachable thing is the palette FAMILY — gruvbox is one of the styles it
# embeds. Adopted 10-09-2026 evening, on the audit's question, after the pass
# had declined it on usage rather than capability.
[pref.follow_terminal_palette.targets.kitty_choose_files_preview]
target = "kitty_choose_files"
key = "dark_pygments_style"
want = "gruvbox"

[pref.follow_terminal_palette.targets.gh]
# gh's glamour markdown renderer emits 256-colour by default: `gh repo view`
# measured 518 off-palette SGR codes at the shipped `disabled`, 0 at `enabled`,
# with the SGR total unchanged — colour kept, depth dropped to the 16.
target = "gh"
key = "accessible_colors"
want = "enabled"

# ── Scrollback ─────────────────────────────────────────────────────────────────

[pref.scrollback]
value = "50,000 lines, paged through bat"
why = "Enough history to hold a long build; bat pages it the same way it pages man pages."

[pref.scrollback.targets.kitty]
key = "scrollback_lines"
want = "50000"

[pref.scrollback.targets.kitty_pager]
target = "kitty"
key = "scrollback_pager"
want_contains = "bat"

# The pager's own deep-history buffer, in MB — kitty's reference puts plain
# ASCII at roughly 10k lines/MB, so this reaches far past the 50k interactive
# lines.
[pref.scrollback.targets.kitty_pager_history]
target = "kitty"
key = "scrollback_pager_history_size"
want = "64"

# Adopted 26-08-2026 from the 0.48.2 reference sweep: an enlarged window
# refills its new rows from history instead of opening them blank.
[pref.scrollback.targets.kitty_fill_enlarged]
target = "kitty"
key = "scrollback_fill_enlarged_window"
want = "yes"

# tmux's own number, four times kitty's 50k and stated nowhere until
# 27-08-2026: SSH sessions persist across attach cycles for days, and tmux
# has no second tier — no scrollback_pager_history_size behind it.
[pref.scrollback.targets.tmux]
key = "history-limit"
want = "200000"

[pref.session_persistence]
value = "tabs and layouts survive a quit"
why = "kitty restores tabs and layouts locally; tmux-resurrect does the same over SSH. Local persistence is save-on-quit plus restore-on-launch — both halves, or neither is real."

[pref.session_persistence.targets.kitty]
key = "startup_session"
want_contains = "last-session.kitty"

# `map` accumulates and the preference lives on ONE line of many. want_any is
# exact per entry: a substring test here would go green over a cmd+q that had
# lost the `: quit` half, or gained a third action, and still contained the
# save. The whole chain is the preference — save AND quit, in that order.
[pref.session_persistence.targets.kitty_save_on_quit]
target = "kitty"
key = "map"
accumulate = true
want_any = "cmd+q combine : save_as_session --save-only ~/.config/kitty/last-session.kitty : quit"

# The SSH half the why names — resurrect is the save/restore mechanism, and
# continuum is what makes it automatic (10-minute autosave, restore on
# server start). Stated nowhere until 27-08-2026: without continuum the
# "tmux-resurrect does it over SSH" claim describes a manual keystroke.
[pref.session_persistence.targets.tmux_resurrect]
target = "tmux"
key = "@plugin"
accumulate = true
want_any_contain = "tmux-resurrect"

[pref.session_persistence.targets.tmux_continuum]
target = "tmux"
key = "@continuum-restore"
want = "on"

[pref.session_persistence.targets.tmux_continuum_interval]
target = "tmux"
key = "@continuum-save-interval"
want = "10"

[pref.close_confirmation]
value = "a close that would take two or more windows asks first"
why = "One window closing is a decision; several at once is more often an accident. At 2 the count includes prompt-idle windows — the layout is part of what would be lost."

[pref.close_confirmation.targets.kitty]
key = "confirm_os_window_close"
want = "2"

