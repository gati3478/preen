state = "unreachable"
recheck = "manual"
target = "tmux_keys"
evidence = "macOS takes the vertical pair before kitty sees it: ctrl+up opens Mission Control, confirmed at the keyboard 09-09-2026. com.apple.symbolichotkeys explains why only that pair — it explicitly disables the four Spaces hotkeys (79-82), freeing ctrl+left/right, while Mission Control and Application Windows (32, 33) carry no override. Manual because absence from that plist means 'shipped default', which the plist cannot report and only a keypress can"

