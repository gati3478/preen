why = "the paged-through-bat family (pref.man_through_bat, kitty's scrollback pager) reaching the package manager — HOMEBREW_BAT is brew's own switch, and its only non-test consumer is dev-cmd/cat.rb (brew edit opens $EDITOR, untouched). Adopted 29-08-2026."

[pref.brew_through_bat.targets.zprofile]
key = "HOMEBREW_BAT"
want = "1"

[pref.brew_through_bat.targets.zsh_live]
target = "zsh_live"
key = "params"
accumulate = true
want_any = "HOMEBREW_BAT=1"

[pref.ncdu_palette]
value = "ncdu renders its structure in the terminal palette"
why = "ncdu ships colourless (--color off is its 2.9.2 default); dark renders usage bars and selection in curses base pairs — the terminal's own 16 colours, the rider rule. Visible structure over a wall of undifferentiated rows. Adopted 29-08-2026."

[pref.ncdu_palette.targets.ncdu]
key = "color"
want = "dark"

[pref.git_rebase_first]
value = "pull rebases; a stack rebases as one"
why = "Linear history by default (pull.rebase, set since the config's import). updateRefs and autosquash adopted 28-08-2026: rebasing a stacked branch updates its dependent refs — the work queue runs multi-PR stacks — and fixup! commits file themselves in interactive rebase."

[pref.git_rebase_first.targets.gitcfg]
