[pref.prompt_starship]
value = "the prompt is starship"
why = "Bespoke over generic: preferences.md § Colour already treats starship as the prompt surface and asserts its accents; this pins the program those assertions assume. (cship renders its first line with the same binary and config, but on its own invocation — not through this eval.)"

[pref.prompt_starship.targets.zshrc]
key = "eval"
accumulate = true
want_any_contain = "starship init zsh"

# The central starship opinion, stated nowhere until 27-08-2026: format is a
# curated allowlist, so a module absent from it can never render —
# suppression is as deliberate as inclusion. Pinned exactly: an edit to the
# prompt's composition is a preferences change first, config second.
# git_state, kotlin, gradle and jobs joined 27-08-2026 (the 1.26 sweep).
# The allowlist exists TWICE: cship's statusline line 1 repeats it minus the
# shell-only modules, because cship runs `starship module` per token and never
# reads starship's format. Line 1 sat on the pre-sweep list until 02-09-2026 —
# hence the second target.

[pref.prompt_starship.targets.zsh_live]
# The eval's END STATE: starship's init defines this precmd hook, so the
# function existing is what proves the prompt is actually starship's.
target = "zsh_live"
key = "functions"
accumulate = true
want_any = "prompt_starship_precmd"

[pref.prompt_curated]
value = "a curated module allowlist, not $all"
why = "The prompt was silent mid-rebase, named java but not the Kotlin·Gradle work stack, and hid backgrounded jobs — all three suppressed by omission, which is why the allowlist is asserted as a whole, in both places it lives. username shows always because gold marks whose session this is (§ Colour)."

[pref.prompt_curated.targets.starship]
key = "format"
want = "$username$directory$git_branch$git_commit$git_state$git_status$fill$python$java$kotlin$gradle$rust$nodejs$jobs$cmd_duration$line_break$character"

[pref.prompt_curated.targets.starship_username]
target = "starship"
key = "username.show_always"
want = "true"

# starship's format minus $username $jobs $cmd_duration $character.
[pref.prompt_curated.targets.cship_line1]
target = "cship"
key = "cship.lines.0"
want = "$directory$git_branch$git_commit$git_state$git_status$python$java$kotlin$gradle$rust$nodejs"

# Line 3's usage windows are two tokens, each coloured by its own utilisation
# (cship 1.8.2). The composite painted both with max(5h, 7d) — measured on the
# sample payload 11-09-2026: 5h at 34% wore 7d's warn colour. Asserted as a
# pair so a revert to the composite, or a lost window, fails the row.
[pref.prompt_curated.targets.cship_line3_windows]
target = "cship"
key = "cship.lines.2"
want_contains = "$cship.usage_limits.session   $cship.usage_limits.weekly"

# Two lines since 16-09-2026: the width left for typing never depends on the
# directory or the branch. In one deep repo the one-line prompt took 70 cells
# before the cursor, at any width — half of this 134-column window. $fill — a
# space, not starship's shipped "." —
# anchors the toolchain at the right margin; the context line separates
# commands, so the blank line goes and the prompt still costs two rows. A
# right prompt was declined the same day (preferences.md § Interaction). The
# format itself is pinned exactly by prompt_curated above, $fill and
# $line_break$character included.
[pref.prompt_input_line]
value = "the input line is bare — its width never depends on the directory"
why = "Half the window was gone before a keystroke in the work repo, and a longer path or branch took more. A right prompt hides the toolchain while typing but leaves the cursor wherever the directory and branch end; two lines remove the dependence, and retiring the blank line keeps the row count."

[pref.prompt_input_line.targets.starship_newline]
target = "starship"
key = "add_newline"
want = "false"

# One space, asserted as one space: a want with edge whitespace is compared
# whitespace-exact against the raw read (the header's `want` entry), so an
# EMPTY symbol — which collapses the fill and the layout with it — fails, and
# so does an absent key: starship would fill with its shipped "." then.
[pref.prompt_input_line.targets.starship_fill]
target = "starship"
key = "fill.symbol"
want = " "

# Icons are the separators. "on " cost three cells and each "via " four —
# three of those on the work stack — and said nothing the glyph does not;
# "took" went the same way, an hourglass in its place. Asserted as exact
# formats, trailing separator space included, never as absences: the starship
# reader has no default oracle, so a want_absent on a deleted key would pass
# while the shipped "via" renders. cship's statusline line 1 renders these
# same formats.
[pref.prompt_icon_separators]
value = "icons separate the prompt's segments; no connective words"
why = "Three vias on the work stack cost twelve cells and carried nothing the glyph does not. The words read as a sentence, and a prompt is not one."

[pref.prompt_icon_separators.targets.starship_branch]
target = "starship"
key = "git_branch.format"
want = "[$symbol$branch]($style) "

[pref.prompt_icon_separators.targets.starship_python]
target = "starship"
key = "python.format"
want = "[$symbol($version)]($style) "

[pref.prompt_icon_separators.targets.starship_java]
target = "starship"
key = "java.format"
want = "[$symbol($version)]($style) "

[pref.prompt_icon_separators.targets.starship_kotlin]
target = "starship"
key = "kotlin.format"
want = "[$symbol]($style)"

[pref.prompt_icon_separators.targets.starship_gradle]
target = "starship"
key = "gradle.format"
want = "[$symbol($version)]($style) "

[pref.prompt_icon_separators.targets.starship_rust]
target = "starship"
key = "rust.format"
want = "[$symbol($version)]($style) "

[pref.prompt_icon_separators.targets.starship_nodejs]
target = "starship"
key = "nodejs.format"
want = "[$symbol($version)]($style) "

[pref.prompt_icon_separators.targets.starship_duration]
target = "starship"
key = "cmd_duration.format"
