# A version shows the digits a decision turns on: the major for the JDK and
# Node, major.minor for Gradle, Python and Rust. The patch never changed a
# decision at the prompt, and v21.0.12 cost nine cells where 21 costs two.
[pref.prompt_versions]
value = "a version shows the digits a decision turns on"
why = "The JDK and Node are platforms chosen by major; Gradle, Python and Rust change behaviour at the minor. A patch number never changed what to type next."

[pref.prompt_versions.targets.starship_java]
target = "starship"
key = "java.version_format"
want = "${major}"

[pref.prompt_versions.targets.starship_nodejs]
target = "starship"
key = "nodejs.version_format"
want = "${major}"

[pref.prompt_versions.targets.starship_gradle]
target = "starship"
key = "gradle.version_format"
