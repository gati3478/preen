want = "true"

[pref.git_rebase_first.targets.gitcfg_updaterefs]
target = "gitcfg"
key = "rebase.updateRefs"
want = "true"

[pref.git_rebase_first.targets.gitcfg_autosquash]
target = "gitcfg"
key = "rebase.autosquash"
want = "true"

[pref.git_diff_reading]
value = "diffs read through delta: side-by-side, line-numbered, histogram-computed"
why = "A diff is a reading surface, so it gets the reading affordances: two panes, line numbers, n/N navigation, and delta on interactive add's hunks too. histogram adopted 28-08-2026 — cleaner hunk boundaries than myers where lines repeat, correctness-first."

[pref.git_diff_reading.targets.gitcfg]
key = "core.pager"
want = "delta"

[pref.git_diff_reading.targets.gitcfg_sxs]
target = "gitcfg"
key = "delta.side-by-side"
want = "true"

[pref.git_diff_reading.targets.gitcfg_linenos]
target = "gitcfg"
key = "delta.line-numbers"
want = "true"

[pref.git_diff_reading.targets.gitcfg_navigate]
target = "gitcfg"
key = "delta.navigate"
want = "true"

[pref.git_diff_reading.targets.gitcfg_histogram]
target = "gitcfg"
key = "diff.algorithm"
want = "histogram"

[pref.git_diff_reading.targets.gitcfg_interactive]
target = "gitcfg"
key = "interactive.diffFilter"
want_contains = "delta"

# The style keys are asserted here; preen doctor proves the OUTPUT stays
# 4-bit behaviourally — the eza precedent (an SGR grep over fixture
# output; eza's fixture is a listing, this one a diff) — because a delta
# upgrade could grow a new decorated element whose default is truecolor
# without any of these keys changing.
[pref.git_ansi_ride]
value = "delta rides the terminal's 16 ANSI colors"
why = "§ Colour's rider rule: named 4-bit colors and pure attributes only, so a kitty theme swap recolors diffs for free. delta's own `brightblack` keyword breaks the rule — it encodes as 38;5;8 — hence `normal dim` for the zero style (measured 28-08-2026, delta 0.19.2)."

[pref.git_ansi_ride.targets.gitcfg]
key = "delta.syntax-theme"
