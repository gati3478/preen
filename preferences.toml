[pref.prompt_versions.targets.starship_python]
target = "starship"
key = "python.version_format"
want = "${major}.${minor}"

[pref.prompt_versions.targets.starship_rust]
target = "starship"
key = "rust.version_format"
want = "${major}.${minor}"

[pref.prompt_versions.targets.starship_kotlin]
state = "unreachable"
target = "starship"
evidence = "starship 1.26.0 reads the Kotlin version from `kotlinc` on PATH — `starship module kotlin` prints the badge alone here — and this machine's Kotlin is Gradle's embedded compiler, which installs no kotlinc; the module's format asks for no version"

# The one thing on the statusline that identifies the SESSION rather than the
# work inside it. cship cannot source it: its own lookup reads the unsuffixed
# `Claude Code-credentials` keychain entry whatever CLAUDE_CONFIG_DIR says
# (cship#194, open at 1.8.3), so under the dual-account shim a work session
# renders the PERSONAL organisation — both tabs did, seen 11-09-2026, which is
# the symptom the issue was filed on. CSHIP_ACCOUNT (cship 1.8.2) moves the fact
# to the process that already knows it, so this is one claim in two halves: the
# module renders {label}, and the launcher supplies it on every exec path it owns.
[pref.session_account]
value = "the statusline names which account's session this is"
why = "Gold marks whose session this is (preferences.md § Colour) — the rule starship's always-shown $username already follows, and the statusline had no equivalent. Two accounts share one settings.json, one terminal and one statusline, and routing is by directory, so the account is the one session fact no other module carries. Sourced from the launcher because cship's own lookup is not merely absent here, it is wrong."

[pref.session_account.targets.cship]
target = "cship"
key = "cship.account.format"
want = "{label}"

# The module can be configured perfectly and still render nowhere: `lines` is
# the curated allowlist (pref.prompt_curated), so the token has to be on one.
[pref.session_account.targets.cship_line2]
target = "cship"
key = "cship.lines.1"
want_contains = "$cship.account"

# starship's directory module trusts $PWD before the real cwd. cship runs it
# with cwd = the session's directory but inherits claude's launch-time $PWD, so
# a worktree session named the launch directory on line 1 — measured
# 02-09-2026 (`PWD=/tmp starship module directory` printed /tmp from inside a
# repo). Physical paths are safe here: no project or vault path is a symlink.
[pref.prompt_physical_dir]
value = "the prompt names the directory the process is in"
why = "A statusline that names the launch directory inside a worktree is wrong in the one place it matters; logical paths bought nothing on this machine because nothing on the way to a project is a symlink."

[pref.prompt_physical_dir.targets.starship]
key = "directory.use_logical_path"
want = "false"

[pref.kittens_at_prompt]
value = "a keyboard file picker, one alias away"
why = "fp picks files with previews without leaving the keyboard — a kitty capability surfaced where the work happens, the prompt. Set since 06-08-2026, stated nowhere until 27-08-2026. Its sibling hg (the hyperlinked-grep kitten) retired 06-09-2026: rg has written the identical links since 29-08 (pref.search_clickable) and kitty's own page for the kitten says so. Spelled through the `kitten` launcher, kitty's current CLI, since the same day."

[pref.kittens_at_prompt.targets.zshrc_picker]
target = "zshrc"
key = "alias"
accumulate = true
want_any_contain = "fp='kitten choose-files'"

[pref.kittens_at_prompt.targets.zsh_live]
target = "zsh_live"
key = "aliases"
accumulate = true
want_any = "alias fp='kitten choose-files'"

[pref.word_motion]
value = "platform-standard word boundaries at the prompt"
why = "option+arrow stops at path segments and Ctrl+W kills one segment — zsh's default WORDCHARS glues whole paths into one word, the opposite of the native macOS motion the criteria name. WORDCHARS adopted 27-08-2026 (zshparam sweep); the option+ARROW half was hollow until 02-09-2026 — kitty sends CSI 1;3D/C (its terminfo kLFT3/kRIT3) and nothing bound them, so the emptied WORDCHARS only ever reached option+b/f and Ctrl+W. Bound now, text and live."

[pref.word_motion.targets.zshrc]
key = "WORDCHARS"
want = ""

[pref.word_motion.targets.zshrc_opt_left]
target = "zshrc"
key = "bindkey"
accumulate = true
want_any_contain = "'^[[1;3D' backward-word"

[pref.word_motion.targets.zshrc_opt_right]
target = "zshrc"
key = "bindkey"
accumulate = true
want_any_contain = "'^[[1;3C' forward-word"

[pref.word_motion.targets.zsh_live_opt_left]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any_contain = '"^[[1;3D" backward-word'

[pref.word_motion.targets.zsh_live_opt_right]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any_contain = '"^[[1;3C" forward-word'

# The deletion twin of the motion: option+fn+delete kills the word ahead,
# as option+delete (bound by default) kills the one behind.
[pref.word_motion.targets.zshrc_opt_delete]
target = "zshrc"
key = "bindkey"
accumulate = true
want_any_contain = "'^[[3;3~' kill-word"

[pref.word_motion.targets.zsh_live_opt_delete]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any_contain = '"^[[3;3~" kill-word'

[pref.line_motion]
value = "Home/End, cmd+arrow and Delete behave natively at the prompt"
why = "The native line motion beside the word motion above. A Home key that does nothing at the prompt is the modal-editing tax paid without the editing. The application-mode pair and fn+delete are pinned here too rather than left to /etc/zshrc, so the taste does not depend on a system file."

[pref.line_motion.targets.zshrc]
key = "bindkey"
accumulate = true
want_any_contain = "'^[[H' beginning-of-line"

[pref.line_motion.targets.zshrc_end]
target = "zshrc"
key = "bindkey"
accumulate = true
want_any_contain = "'^[[F' end-of-line"

[pref.line_motion.targets.zshrc_cmd_left]
target = "zshrc"
key = "bindkey"
accumulate = true
want_any_contain = "'^[[1;9D' beginning-of-line"

[pref.line_motion.targets.zshrc_cmd_right]
target = "zshrc"
key = "bindkey"
accumulate = true
want_any_contain = "'^[[1;9C' end-of-line"

[pref.line_motion.targets.zsh_live_home]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any_contain = '"^[[H" beginning-of-line'

[pref.line_motion.targets.zsh_live_end]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any_contain = '"^[[F" end-of-line'

[pref.line_motion.targets.zsh_live_app_home]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any_contain = '"^[OH" beginning-of-line'

[pref.line_motion.targets.zsh_live_app_end]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any_contain = '"^[OF" end-of-line'

[pref.line_motion.targets.zsh_live_cmd_left]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any_contain = '"^[[1;9D" beginning-of-line'

[pref.line_motion.targets.zsh_live_cmd_right]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any_contain = '"^[[1;9C" end-of-line'

# fn+delete, pinned 02-09-2026. /etc/zshrc binds the same key from terminfo,
# so the live half stays green without the managed line — the text half is
# the one with teeth here, and it exists so the taste survives a ZDOTDIR
# move or a system file that stops binding it. Exact on both: a substring
# would survive a rebind to delete-char-or-list.
[pref.line_motion.targets.zshrc_delete]
target = "zshrc"
key = "bindkey"
accumulate = true
want_any = "'^[[3~' delete-char"

[pref.line_motion.targets.zsh_live_delete]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any = 'bindkey "^[[3~" delete-char'

[pref.slow_command_report]
value = "commands over 10s of CPU time report timing unasked"
why = "The question after a slow command is 'how slow was that?' — answered passively, in-terminal. Distinct from kitty's declined notify_on_cmd_finish, which is a desktop notification. CPU time, not wall clock: a network wait never reports. Adopted 27-08-2026 (zshparam sweep)."

[pref.slow_command_report.targets.zshrc]
key = "REPORTTIME"
want = "10"

[pref.slow_command_report.targets.zsh_live]
target = "zsh_live"
key = "params"
accumulate = true
want_any = "REPORTTIME=10"

[pref.buffer_to_editor]
value = "Ctrl+X Ctrl+E edits the buffer in $EDITOR"
why = "A multi-line command belongs in the editor EDITOR names (zed --wait), not nursed through ZLE. Text asserts the binding as written; live asserts the widget exists and the key resolves after every init has had its chance to bind. Adopted 27-08-2026 (zshcontrib)."

[pref.buffer_to_editor.targets.zshrc]
key = "bindkey"
accumulate = true
want_any_contain = "'^X^E' edit-command-line"

[pref.buffer_to_editor.targets.zsh_live]
key = "bindkey"
accumulate = true
want_any_contain = '"^X^E" edit-command-line'

[pref.buffer_to_editor.targets.zsh_live_widget]
target = "zsh_live"
key = "widgets"
accumulate = true
want_any_contain = "edit-command-line"

[pref.correction_scope]
value = "correction never offers completion functions"
why = "CORRECT itself stays a preference-not-decision (decisions.md); this only stops _git being offered as the fix for a git typo. Adopted 27-08-2026 (zshparam sweep)."

[pref.correction_scope.targets.zshrc]
key = "CORRECT_IGNORE"
want = "_*"

# Esc-h is bound to run-help by zsh's defaults, but run-help ships as an
# alias to plain man — `git commit` opened man git. The autoloaded function
# plus zsh's shipped helpers (zshcontrib) resolve the subcommand; the alias
# would shadow the function, so its absence is asserted live, the
# want_absent shape on a list section. Adopted 02-09-2026.

[pref.correction_scope.targets.zsh_live]
target = "zsh_live"
key = "params"
accumulate = true
want_any = "CORRECT_IGNORE=_*"

[pref.help_at_cursor]
value = "Esc-h opens the manual for the command under the cursor, subcommand-aware"
why = "Proactive assistance at the prompt: the question after an unfamiliar subcommand is its manual, and MANPAGER already renders one through bat in the terminal palette."

[pref.help_at_cursor.targets.zshrc]
key = "unalias"
want_contains = "run-help"

[pref.help_at_cursor.targets.zshrc_helpers]
target = "zshrc"
key = "autoload"
accumulate = true
want_any_contain = "run-help-git"

[pref.help_at_cursor.targets.zsh_live]
key = "aliases"
accumulate = true
want_absent = "run-help=man"

[pref.help_at_cursor.targets.zsh_live_helpers]
target = "zsh_live"
key = "functions"
accumulate = true
want_any = "run-help-git"

[pref.help_at_cursor.targets.zsh_live_key]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any_contain = '"^[h" run-help'

[pref.glob_order]
value = "* sorts numerically"
why = "file2 before file10 — the order the names read in, not the bytes. Adopted 02-09-2026 (zshoptions, third pass)."

[pref.glob_order.targets.zshrc]
key = "setopt"
accumulate = true
want_any = "NUMERIC_GLOB_SORT"

[pref.glob_order.targets.zsh_live]
key = "setopt"
accumulate = true
want_any = "numericglobsort"

[pref.search_scope]
value = "every searcher sees the same world — hidden yes, .git no"
why = "extends the glob/fd agreement (GLOB_DOTS for *, fd --hidden --exclude .git for fzf — pref.globs_see_dotfiles, pref.fuzzy_finder) to rg, adopted 29-08-2026. The zshenv entry is the gate: rg reads a config only when RIPGREP_CONFIG_PATH names one, so without it every ripgrep entry below is green about dead text. zsh_live proves the export survives to a real shell's end state."

# `fp` is the fourth searcher, and it disagreed with the other three. The
# kitten's two SCOPE switches ship as the literal `last` — remember the last
# toggled value — as do its sort key and its preview toggle, so the picker's
# idea of what exists was per-machine mutable state with no declared value,
# starting hidden-files-OFF. Three rows, because
# no single one of them is the preference: show_hidden alone starts surfacing
# .git/, which fd is explicitly told to exclude, and `ignore` is honoured only
# while respect_ignores is on, so that is declared rather than left remembering.
[pref.search_scope.targets.kitty_choose_files]
key = "show_hidden"
want = "yes"

[pref.search_scope.targets.kitty_choose_files_ignores]
target = "kitty_choose_files"
key = "respect_ignores"
want = "yes"

[pref.search_scope.targets.kitty_choose_files_git]
target = "kitty_choose_files"
key = "ignore"
accumulate = true
want_any = ".git/"

[pref.search_scope.targets.ripgrep]
key = "hidden"
want = "on"

[pref.search_scope.targets.ripgrep_git]
target = "ripgrep"
key = "glob"
accumulate = true
want_any_contain = "!.git"

[pref.search_scope.targets.zshenv]
key = "RIPGREP_CONFIG_PATH"
want_contains = ".config/ripgrep/config"

[pref.search_case]
value = "search folds case until the pattern carries a capital"
why = "completion's case-insensitivity (pref.completion_style case matcher), applied to search — adopted 29-08-2026. --smart-case only engages when no case flag is given, so an explicit -s/-i still wins at any call site."

[pref.search_case.targets.ripgrep]
key = "smart-case"
want = "on"

[pref.search_clickable]
value = "grep matches are kitty-clickable"
why = "the eza --hyperlink instinct (pref.listings_eza) for search: rg emits OSC 8 links only on a real terminal, so pipes and captures stay clean. Adopted 29-08-2026."

[pref.search_clickable.targets.ripgrep]
key = "hyperlink-format"
want = "kitty"

[pref.hyperlink_actions]
value = "a search hit opens in Zed at its line; a directory opens as a new tab there; an extensionless executable and any other text file open in Zed; hovering with cmd shows where the click will land"
why = "The link is the address of the thing the eye just found; the click should land there, not in whatever app owns the extension. Zed is the editor (pref.editor_env), a tab is named by where it is (pref.tab_identity), and the rest — images, PDFs, binaries — stays with the platform default. ⚠️ That last clause has one deliberate exception since 10-09-2026: the `inode/executable` entry sends extensionless executables to Zed, and it cannot tell a shell script from a compiled binary. The scripts are this repo's own bin/, clicked from a listing daily; a misclicked binary costs one garbage buffer. Entry ORDER is part of the preference, not presentation — kitty takes the first entry whose criteria all match, so `mime text/*` is last because it matches everything above it too."

# One row per behaviour the `why` names, each pinning a whole entry in file
# order. This was SIX rows over the individual directives until 10-09-2026 —
# fragment_matches, three actions, two mimes — and between them they asserted a
# bag: the reader flattens the file, so swapping which action sat under which
# criteria, or moving `mime text/*` ahead of the FRAGMENT entry — which carries
# no mime at all, so a `.txt#42` link satisfies both — left all six green while
# the click landed somewhere else. Order is the behaviour here, so the entry is
# the unit. (`text/*` does not shadow the inode/* entries: a directory and an
# executable type as `inode/directory` and `inode/executable`, neither of which
# glob-matches it.)
# Hovering shows where the click will land — the address half of "a link is the
# address of what the eye just found". A modifier rather than `always`: a URL
# painted permanently over every hovered filename in an `ll` listing is the
# clutter tab_title_max_length exists to prevent, and cmd is free of any
# default mouse action. Adopted 10-09-2026.
[pref.hyperlink_actions.targets.kitty_hover_target]
target = "kitty"
key = "show_hyperlink_targets"
want = "cmd"

[pref.hyperlink_actions.targets.kitty_search_hit]
target = "kitty_open_action_blocks"
key = "block1"
want = "protocol file; fragment_matches ^[0-9]+$; action launch --type=background zed -- ${FILE_PATH}:${FRAGMENT}"

# Ahead of the text entry deliberately: a directory has no mime type Python
# would call text, but it does match nothing else, and an entry that shadowed
# it would open directories in the editor.
[pref.hyperlink_actions.targets.kitty_directory_tab]
target = "kitty_open_action_blocks"
key = "block2"
want = "protocol file; mime inode/directory; action launch --type=tab --cwd=${FILE_PATH}"

# The repo's own bin/ scripts: extensionless, so Python's table gives them no
# type at all and the text entry below cannot reach them. kitty types them
# itself. Deliberate trade, stated in the file too: `inode/executable` cannot
# tell a script from a compiled binary, which the taste would rather leave with
# the platform — a script is the daily case, a misclicked binary costs one
# garbage buffer.
[pref.hyperlink_actions.targets.kitty_executable_editor]
target = "kitty_open_action_blocks"
key = "block3"
want = "protocol file; mime inode/executable; action launch --type=background zed -- ${FILE_PATH}"

# LAST, and that is the whole of its correctness — specifically behind the
# fragment entry, which tests no mime, so a text file's `#line` link matches
# both and text-first would drop the line number.
[pref.hyperlink_actions.targets.kitty_text_editor]
target = "kitty_open_action_blocks"
key = "block4"
want = "protocol file; mime text/*; action launch --type=background zed -- ${FILE_PATH}"

# The stack's extensions that Python's mimetypes table lacks (Kotlin, Gradle,
# Svelte, .tsx, .properties, .zsh) or, through macOS's /etc/apache2/mime.types
# that every Python reads at init, mislabels (.rs as
# application/rls-services+xml, .ts as video/mp2t, .sql as application/x-sql —
# the first two measured 06-09-2026, the third 10-09-2026): without these a
# listed source file falls past the text rule to `open`.
#
# A row per line, and that is the point. Three lines were pinned until
# 10-09-2026 and the comment here closed with "the rest of the file is the same
# shape" — which is exactly what licensed the hole: deleting text/x-gradle,
# text/x-svelte, text/x-properties or text/x-shellscript left every row green
# while § Interaction's own sentence names Gradle and Svelte out loud. A
# promise nothing enforces is a wish, as the ceiling table's own callout says.
# Each key is distinct, so there is nothing for an aggregate row to aggregate,
# and a row per line names the promise it keeps in its own label.
[pref.hyperlink_actions.targets.kitty_mime_kotlin]
target = "kitty_mime_types"
key = "text/x-kotlin"
want = "kt kts"

[pref.hyperlink_actions.targets.kitty_mime_gradle]
target = "kitty_mime_types"
key = "text/x-gradle"
want = "gradle"

[pref.hyperlink_actions.targets.kitty_mime_svelte]
target = "kitty_mime_types"
key = "text/x-svelte"
want = "svelte"

[pref.hyperlink_actions.targets.kitty_mime_sql]
target = "kitty_mime_types"
key = "text/x-sql"
want = "sql"

[pref.hyperlink_actions.targets.kitty_mime_properties]
target = "kitty_mime_types"
key = "text/x-properties"
want = "properties"

[pref.hyperlink_actions.targets.kitty_mime_zsh]
target = "kitty_mime_types"
key = "text/x-shellscript"
want = "zsh"

[pref.hyperlink_actions.targets.kitty_mime_rust]
target = "kitty_mime_types"
key = "text/x-rust"
want = "rs"

[pref.hyperlink_actions.targets.kitty_mime_typescript]
target = "kitty_mime_types"
key = "text/typescript"
want = "ts tsx"

[pref.pager_less]
value = "LESS='-iRF --incsearch --wordwrap' — one lever for every pager"
why = "bat's less, delta's less and a bare pipe all read $LESS (brew has no pager path of its own — its routes are cat→bat and git commands→delta): -i folds case in pager search (completion's rule again), -R passes ANSI through on manual pipes, -F prints-and-exits on one-screen output, --incsearch moves the match as you type (less 668). Adopted 29-08-2026; --mouse deliberately declined — less grabbing the mouse breaks kitty copy-on-select inside pagers."

[pref.pager_less.targets.zshrc]
key = "LESS"
want = "-iRF --incsearch --wordwrap -Q --no-vbell"

[pref.pager_less.targets.zsh_live]
key = "params"
accumulate = true
want_any = "LESS=-iRF --incsearch --wordwrap -Q --no-vbell"

[pref.pager_less.targets.zshrc_readnull]
target = "zshrc"
key = "READNULLCMD"
want = "less"

[pref.pager_less.targets.zsh_live_readnull]
target = "zsh_live"
key = "params"
accumulate = true
want_any = "READNULLCMD=less"

[pref.brew_local_only]
value = "Homebrew sends no analytics"
why = "the atuin reasoning — no account, no sync, no telemetry — applied to the package manager. Analytics were measurably ON until 29-08-2026 (`brew analytics` reported enabled). zsh_live proves the export reaches a real login shell, the isolated-PTY read that no contaminated caller environment can fake."

[pref.brew_local_only.targets.zprofile]
key = "HOMEBREW_NO_ANALYTICS"
want = "1"

[pref.brew_local_only.targets.zsh_live]
key = "params"
accumulate = true
want_any_contain = "HOMEBREW_NO_ANALYTICS=1"

[pref.brew_through_bat]
