[pref.deterministic_geometry]
value = "a window opens at the declared size, every time"
why = "Remembered geometry drifts — so size is declared, never inherited from the last session. The statusline does not depend on it: cship follows the live width (traps.md)."

[pref.deterministic_geometry.targets.kitty]
key = "remember_window_size"
want = "no"

# The declared size itself. cship's `width = 129` was believed coupled to this
# until 02-09-2026 (traps.md); it is a fallback a terminal never reaches, so
# only the geometry is pinned here.
[pref.deterministic_geometry.targets.kitty_width]
target = "kitty"
key = "initial_window_width"
want = "1300"

[pref.deterministic_geometry.targets.kitty_height]
target = "kitty"
key = "initial_window_height"
want = "840"

[pref.window_margin]
value = "0.5"
why = "Half a cell between text and the window edge — text should not touch chrome."

[pref.window_margin.targets.kitty]
key = "window_margin_width"
want = "0.5"

[pref.window_margin.targets.tmux]
state = "unreachable"
recheck = "manual"
evidence = "tmux panes have no padding option — the only 'padding' in man tmux 3.7c is scrollbar padding under pane-scrollbars-style; text touches pane borders over SSH"

[pref.window_title_placement]
value = "window"
