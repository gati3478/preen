# ── Option key ─────────────────────────────────────────────────────────────────

[pref.option_key]
value = "left Option is Alt; right Option still types symbols"
why = "Alt bindings (fzf's Alt+C among them) cannot fire without an Alt key, and surrendering both Options would trade the whole macOS symbol layer for it."

[pref.option_key.targets.kitty]
key = "macos_option_as_alt"
want = "left"

# The SSH half of the same taste: with extended-keys off, a TUI inside tmux
# cannot even request the modifier combos kitty sends — the Alt layer would
# stop at the tmux border. Opt-in per application; adopted 27-08-2026.
[pref.option_key.targets.tmux]
key = "extended-keys"
want = "on"

[pref.tab_identity]
value = "a tab is named by where it is, not what it runs"
why = "Index plus working directory: the index is what cmd+N jumps to, and the directory is the question actually asked when scanning a tab bar."

[pref.tab_identity.targets.kitty]
key = "tab_title_template"
want_contains = "active_wd"

# The template carries BOTH halves of the stated taste and only the directory
# half was read. `{index}` is the number cmd+N jumps to, so a template that
# dropped it would leave the tab bar naming places with no way to see which
# key reaches them — with the row below still green on the binding.
[pref.tab_identity.targets.kitty_index_in_title]
target = "kitty"
key = "tab_title_template"
want_contains = "{index}"

# The other half of the stated taste — "the index is what cmd+N jumps to".
# One representative binding of the nine: if a remap wipes them, goto_tab 1
# goes with the rest.
[pref.tab_identity.targets.kitty_index_jump]
target = "kitty"
key = "map"
accumulate = true
want_any_contain = "goto_tab 1"

# A new tab starts where the current one is (06-09-2026). kitty's default
# new_tab starts at kitty's own launch directory — home, from the Dock — so
# the directory the bar names for the new tab was never the one being
# worked in. new_tab_with_cwd is launch --type=tab --cwd=current: at a
# prompt that is the shell integration's OSC 7 report (gates /
# kitty_shell_integration keeps `no-cwd` out), mid-command the foreground
# process's directory by syscall — kitty 0.48.2's window.py, not its page.
[pref.tab_identity.targets.kitty_new_tab_cwd]
target = "kitty"
key = "map"
accumulate = true
want_any = "cmd+t new_tab_with_cwd"

# The tmux twin, stated nowhere until 27-08-2026: windows are named by their
# directory basename and numbered from 1 with no gaps — index plus working
# directory, the same identity rule. set-titles-string hands the same answer
# up to kitty's titlebar.
[pref.tab_identity.targets.tmux]
key = "automatic-rename-format"
want = "#{b:pane_current_path}"

[pref.tab_identity.targets.tmux_index]
target = "tmux"
key = "base-index"
want = "1"

[pref.tab_identity.targets.tmux_renumber]
target = "tmux"
key = "renumber-windows"
want = "on"

[pref.tab_identity.targets.tmux_titles]
target = "tmux"
key = "set-titles-string"
want_contains = "pane_current_path"

[pref.horizontal_tab_bar]
value = "bottom"
why = "A left sidebar was trialled 25-08-2026 and declined: ~30 of the window's 129 content columns for information the tab title already carries."

# Three want_absent rows — left, right, top — said this until 10-09-2026, and
# none of them was case-folded while kitty lowercases the value before matching
# it, so `tab_bar_edge TOP` put the bar on top with all three green. The
# preference is a position, so it is now stated as one; `unset_reads_default`
# reads kitty's own default for a key the config leaves unwritten. Same trade as
# the allow_hyperlinks gate: `Bottom` reads red though kitty would honour it.
[pref.horizontal_tab_bar.targets.kitty]
key = "tab_bar_edge"
want = "bottom"
unset_reads_default = true

# The look of the bar itself — one look, both halves pinned.
[pref.tab_bar_shape]
value = "slanted powerline"
why = "The bar reads as one continuous strip of slanted segments, and a 30-cell title cap keeps a deep path from eating it. Held 26-08-2026 against live renders of all six shipped variants."

[pref.tab_bar_shape.targets.kitty]
key = "tab_bar_style"
want = "powerline"

[pref.tab_bar_shape.targets.kitty_powerline]
target = "kitty"
key = "tab_powerline_style"
want = "slanted"

[pref.tab_bar_shape.targets.kitty_title_cap]
target = "kitty"
key = "tab_title_max_length"
want = "30"

# ── Gates: switches that decide whether a value applies at all ────────────────
# Three assertions elsewhere in this file read a VALUE while the switch that
# makes it take effect went unchecked. Flip any of these and the corresponding
# check stays green over a setting the application is ignoring — the same
# "assertion does not match its own scope" defect that the ligature and caret
# entries had.

[pref.gates]
value = "the switches that make other asserted values effective"
why = "A value the application is configured to ignore is not a preference that holds."

# wrap_guides is an array Zed will happily keep and not render.
[pref.gates.targets.zed]
key = "show_wrap_guides"
want = "true"

# Without no-cursor the shell fights kitty for the caret shape, so
# `cursor_shape underline` stops being what you see. preferences.md states this
# as part of the cursor preference, not as a separate setting.
[pref.gates.targets.kitty]
key = "shell_integration"
want_contains = "no-cursor"

# The rest of that same directive. kitty's zsh shell integration stays fully
# enabled bar the cursor: its OSC 133 prompt marks power jump-to-prompt, the
# last-command-output pager, click-to-move-cursor and glitch-free redraw of
# the starship prompt on resize; its OSC 2 report keeps the cwd in the window
# title and OSC 7 lets a new window inherit it (preferences.md § Interaction).
# The caret gate above only checks that `no-cursor` is PRESENT (want_contains),
# so any of the integration's other keywords — no-prompt-mark, no-cwd,
# no-title, no-complete, no-sudo — would switch a capability off and stay green
# there. Exact match is the one matcher that rejects any of them in a single
# scalar assertion; a wholesale `disabled` or a dropped `no-cursor` is caught
# here AND by the caret gate, which is reinforcement, not redundancy.
[pref.gates.targets.kitty_shell_integration]
target = "kitty"
key = "shell_integration"
want = "enabled no-cursor"

# The whole click surface rides kitty's DEFAULT mouse table, which this config
# never names: the plain left click that opens a link, the drag that feeds
# copy_on_select, the double-click that select_by_word_characters shapes. One
# line discards it — the shipped reference's own words are "Remove all mouse
# action definitions up to this point. Useful, for instance, to remove the
# default mouse actions" — with no error anywhere, leaving every hyperlink and
# selection row in this file green over gestures that do nothing. That is the
# identical shape the allow_hyperlinks gate below exists for, and the repo
# already reasoned this exact gate through on the tmux side. Sharpest instance:
# the row further down pins the value that shapes a double-click while the
# double-click itself was unpinned.
[pref.gates.targets.kitty_mouse_table]
target = "kitty"
key = "clear_all_mouse_actions"
want = "no"
unset_reads_default = true

# The other way to lose a gesture: `mouse_map button event modes` with no
# action unbinds it, and the reference's worked example is exactly the left
# click that opens links. kitty's grammar gives every mouse_map a `modes` field
# spelled `grabbed`, `ungrabbed` or both, so one absent-substring row holds
# while the config names no mouse_map at all — which IS the preference here.
# kitty lowercases the modes before it checks them (`parse_mouse_map`, frozen
# bytecode, 10-09-2026), so `UNGRABBED` is the same unbind — and it passed
# this row until want_absent was case-folded the same day. The
# `clear_all_mouse_actions` row beside it is the exact one, which is why this
# one is the second line of defence and not the first. Adding a deliberate
# mouse_map is a decision, and this row going red is the prompt to record it
# here.
[pref.gates.targets.kitty_mouse_map]
target = "kitty"
key = "mouse_map"
accumulate = true
want_absent = "grabbed"

# Every OSC 8 link — eza's, rg's, the open-actions entries they feed — rides
# allow_hyperlinks, kitty's default and therefore a key this file never names.
# This was TWO want_absent rows, `no` and `ask`, until 10-09-2026, and they
# were passed by every other spelling of the same thing: want_absent is a
# substring test over an un-lowercased read, while kitty's own parser (read off
# the frozen bytecode) is `if x == 'ask': ask; return to_bool(x)`, and to_bool
# lowercases and accepts y/yes/true — so `n`, `false`, `0`, `off` and `NO` all
# switched the links off with both rows green. One positive statement replaces
# them, and `unset_reads_default` is what lets it be positive about a key that
# is absent: kitty's shipped reference conf supplies the default, so the row
# also fails the day upstream changes it.
# The trade this makes deliberately: kitty case-folds and accepts y/true, this
# row does not, so a compliant-but-oddly-spelled `Yes` reads red. Nobody writes
# that, and a red says "look at this line" — which is the right answer to a
# hand-edit of the switch under every link on the surface.
[pref.gates.targets.kitty_allow_hyperlinks]
target = "kitty"
key = "allow_hyperlinks"
want = "yes"
unset_reads_default = true

# The history-FILE assertions below § Shell ride on where HISTFILE points
# (atuin's sqlite store and the in-memory HISTSIZE do not). The
# first draft of this comment claimed "zsh persists nothing unless HISTFILE
# is set" — refuted by its own mutation battery: macOS /etc/zshrc supplies
# the same ${ZDOTDIR:-$HOME}/.zsh_history fallback, so DELETING the line
# changes nothing here. What the gate really pins is the destination: a
# .local overlay or a ZDOTDIR move redirecting history elsewhere fails the
# live twin (the capture prints it expanded, hence the absolute-path match),
# and the text half fails on any explicit override, last-wins. The live
# want anchors the full expanded path — a bare '/.zsh_history' would pass a
# same-basename move (its own audit's catch).
[pref.gates.targets.zshrc_histfile]
target = "zshrc"
key = "HISTFILE"
want = "~/.zsh_history"

# The compinit staleness check rides (#q…) extended-glob syntax; without this
# option the guard never fires and the cached fast path never runs — silently,
# with completions still working (traps.md's compinit entry). Text-half only:
# the realistic failure is the setopt line being edited away, not an overlay
# unsetting it.
[pref.gates.targets.zshrc_extended_glob]
target = "zshrc"
key = "setopt"
accumulate = true
want_any = "EXTENDED_GLOB"

# `disabled = true` is how the account module spent 06-08-2026 to 11-09-2026,
# and it renders nothing while set — every pref.session_account row would stay
# green. Absent is enabled, so this is want_absent rather than a value: cship
# offers no positive spelling, and an upstream flip of that default is what the
# [surfaces] EVENT on a version bump is there to catch.
[pref.gates.targets.cship_account]
target = "cship"
key = "cship.account.disabled"
want_absent = "true"

[pref.shell_history]
value = "100,000 lines, shared, deduplicated, timestamped"
why = "History is a queryable record, not a convenience: shared across sessions, big enough to hold months, deduplicated so Up is signal, timestamped so imports keep real dates."

[pref.shell_history.targets.zshrc]
key = "HISTSIZE"
want = "100000"

[pref.shell_history.targets.zshrc_save]
target = "zshrc"
key = "SAVEHIST"
want = "100000"

[pref.shell_history.targets.zshrc_shared]
target = "zshrc"
key = "setopt"
accumulate = true
want_any = "SHARE_HISTORY"

[pref.shell_history.targets.zshrc_dedupe]
target = "zshrc"
key = "setopt"
accumulate = true
want_any = "HIST_IGNORE_ALL_DUPS"

[pref.shell_history.targets.zshrc_stamps]
target = "zshrc"
key = "setopt"
accumulate = true
want_any = "EXTENDED_HISTORY"

# The live twin proves no .local overlay shrank it.
[pref.shell_history.targets.zsh_live]
key = "params"
accumulate = true
want_any_contain = "HISTSIZE=100000"

# History hygiene beyond the headline: leading space keeps a command out of
# the record, blank runs collapse, search never repeats a line, expansions
# preview before running. Set since 06-08-2026, stated nowhere until
# 26-08-2026. The last two are the sweep's adoptions of that date: fcntl
# locking for the shared file, dedupe at write-out.
[pref.shell_history.targets.zshrc_space]
target = "zshrc"
key = "setopt"
accumulate = true
want_any = "HIST_IGNORE_SPACE"

[pref.shell_history.targets.zshrc_blanks]
target = "zshrc"
key = "setopt"
accumulate = true
want_any = "HIST_REDUCE_BLANKS"

[pref.shell_history.targets.zshrc_verify]
target = "zshrc"
key = "setopt"
accumulate = true
want_any = "HIST_VERIFY"

[pref.shell_history.targets.zshrc_find]
target = "zshrc"
key = "setopt"
accumulate = true
want_any = "HIST_FIND_NO_DUPS"

[pref.shell_history.targets.zshrc_lock]
target = "zshrc"
key = "setopt"
accumulate = true
want_any = "HIST_FCNTL_LOCK"

[pref.shell_history.targets.zshrc_save_dedupe]
target = "zshrc"
key = "setopt"
accumulate = true
want_any = "HIST_SAVE_NO_DUPS"

[pref.prefix_history_search]
value = "Up/Down match everything typed so far"
why = "The stated protected binding: anything that wants the arrow keys has to be told not to take them. The live entries ARE the protection — they read the end state, after everything else has had its chance to bind."

[pref.prefix_history_search.targets.zshrc]
key = "bindkey"
accumulate = true
want_any_contain = "'^[[A' history-beginning-search-backward-end"

[pref.prefix_history_search.targets.zshrc_down]
target = "zshrc"
key = "bindkey"
accumulate = true
want_any_contain = "'^[[B' history-beginning-search-forward-end"

[pref.prefix_history_search.targets.zsh_live]
key = "bindkey"
accumulate = true
want_any_contain = '"^[[A" history-beginning-search-backward-end'

[pref.prefix_history_search.targets.zsh_live_down]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any_contain = '"^[[B" history-beginning-search-forward-end'

# The same two keys in application-cursor mode (SS3 A/B) — what a TUI that
# died without resetting the terminal leaves behind. /etc/zshrc binds these
# from terminfo to up-line-or-search, the first-word search the zshrc block
# exists to replace, so until 02-09-2026 the protected binding held on one
# encoding and silently degraded on the other.
[pref.prefix_history_search.targets.zshrc_app_up]
target = "zshrc"
key = "bindkey"
accumulate = true
want_any_contain = "'^[OA' history-beginning-search-backward-end"

[pref.prefix_history_search.targets.zshrc_app_down]
target = "zshrc"
key = "bindkey"
accumulate = true
want_any_contain = "'^[OB' history-beginning-search-forward-end"

[pref.prefix_history_search.targets.zsh_live_app_up]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any_contain = '"^[OA" history-beginning-search-backward-end'

[pref.prefix_history_search.targets.zsh_live_app_down]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any_contain = '"^[OB" history-beginning-search-forward-end'

[pref.keymap_declared]
value = "the emacs keymap, by declaration"
why = "Non-modal per the criteria, and pinned rather than inferred — a future nvim fallback in .zshenv would otherwise flip the prompt into modal editing with no line in .zshrc changing (02-09-2026). It precedes every binding: a binding made while main pointed at viins lives in viins and is lost when the keymap switches (measured the same day — Shift+Tab bound before `bindkey -e` read back undefined)."

[pref.keymap_declared.targets.zshrc]
key = "bindkey"
accumulate = true
want_any = "-e"

[pref.keymap_declared.targets.zsh_live]
key = "bindkey"
accumulate = true
want_any_contain = "bindkey -A emacs main"

[pref.history_search_tool]
value = "Ctrl+R is atuin"
why = "History as a queryable store that knows where a command ran and whether it worked; fzf's flat-file filter concedes the key. Both flags are REQUIRED: --disable-up-arrow keeps atuin off the protected Up binding, --disable-ai keeps its default Atuin-AI `?` binding out of a local-only history."

[pref.history_search_tool.targets.zshrc]
key = "eval"
accumulate = true
want_any_contain = "atuin init zsh --disable-up-arrow --disable-ai"

[pref.history_search_tool.targets.zsh_live]
key = "bindkey"
accumulate = true
want_any_contain = '"^R" atuin-search'

# The search UI shows the two facts the why above says atuin was hired for —
# where a command ran and whether it worked. The shipped default displayed
# neither (adopted 27-08-2026, with workspaces and the tmux popup).
[pref.history_search_tool.targets.atuin]
key = "ui.columns"
want_contains = "exit"

[pref.history_search_tool.targets.atuin_dir]
target = "atuin"
key = "ui.columns"
want_contains = "directory"

[pref.history_search_tool.targets.atuin_workspaces]
target = "atuin"
key = "workspaces"
want = "true"

[pref.history_search_tool.targets.atuin_tmux]
target = "atuin"
key = "tmux.enabled"
want = "true"

[pref.fuzzy_finder]
value = "Ctrl+T files, Alt+C directories, fed by fd"
why = "fd honours .gitignore and skips the heavy build directories, so the finder searches what the repo considers real — by an explicit, asserted command rather than whatever fzf's built-in walker decides. (A 'shells out to find' premise here was refuted 26-08-2026.)"

[pref.fuzzy_finder.targets.zshrc]
key = "source"
accumulate = true
want_any_contain = "fzf --zsh"

[pref.fuzzy_finder.targets.zshrc_fd]
target = "zshrc"
key = "FZF_DEFAULT_COMMAND"
want_contains = "fd --type f --hidden"

# The directories half of the stated taste — "Alt+C directories, fed by fd".
# Asserted 27-08-2026; until then only the files half had teeth.
[pref.fuzzy_finder.targets.zshrc_fd_dirs]
target = "zshrc"
key = "FZF_ALT_C_COMMAND"
want_contains = "fd --type d --hidden"

# Ctrl+T's command is a GATE, not a mirror kept for tidiness: the widget
# runs with FZF_DEFAULT_COMMAND=${FZF_CTRL_T_COMMAND:-} (key-bindings.zsh
# 0.74.3, read 02-09-2026), so an unset FZF_CTRL_T_COMMAND EMPTIES the
# default and the built-in walker runs, .gitignore ignored — while zshrc_fd
# above stays green. Unasserted until 02-09-2026. Text pins the mirror; live
# pins the expanded value a real shell exports.
[pref.fuzzy_finder.targets.zshrc_ctrl_t]
target = "zshrc"
key = "FZF_CTRL_T_COMMAND"
want = "$FZF_DEFAULT_COMMAND"

[pref.fuzzy_finder.targets.zsh_live_ctrl_t]
target = "zsh_live"
key = "params"
accumulate = true
want_any = "FZF_CTRL_T_COMMAND=fd --type f --hidden --exclude .git"

# Previews answer "is this the one I mean?" before Enter — adopted
# 27-08-2026 from the fzf 0.74 sweep. Both ride the palette: bat via its
# asserted --theme=ansi, eza via its measured 4-bit defaults.
[pref.fuzzy_finder.targets.zshrc_preview_files]
target = "zshrc"
key = "FZF_CTRL_T_OPTS"
want_contains = "bat --color=always"

[pref.fuzzy_finder.targets.zshrc_preview_dirs]
target = "zshrc"
key = "FZF_ALT_C_OPTS"
want_contains = "eza -1 --icons=auto --color=always --group-directories-first"

[pref.fuzzy_finder.targets.zsh_live]
key = "bindkey"
accumulate = true
want_any_contain = '"^T" fzf-file-widget'

[pref.fuzzy_finder.targets.zsh_live_altc]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any_contain = '"^[c" fzf-cd-widget'

# `**<TAB>` — fzf's path completion — walks with fd through two hooks fzf
# looks up BY NAME at call time (completion.zsh 0.74.3, measured
# 02-09-2026). Without them it falls back to its built-in walker, which
# knows nothing of .gitignore, so `zed **<TAB>` and Ctrl+T disagreed about
# what exists. Text asserts the walker each hook runs; live asserts the
# hook exists, which is the only thing fzf checks.
[pref.fuzzy_finder.targets.zshrc_compgen]
target = "zshrc"
key = "_fzf_compgen_path()"
want_contains = "fd --hidden --exclude .git"

[pref.fuzzy_finder.targets.zshrc_compgen_dir]
target = "zshrc"
key = "_fzf_compgen_dir()"
want_contains = "fd --type d --hidden --exclude .git"

[pref.fuzzy_finder.targets.zsh_live_compgen]
target = "zsh_live"
key = "functions"
accumulate = true
want_any = "_fzf_compgen_path"

[pref.dir_jumper]
value = "zoxide"
why = "z <partial-path> jumps by frecency; cd is for adjacent moves."

[pref.dir_jumper.targets.zshrc]
key = "eval"
accumulate = true
want_any_contain = "zoxide init zsh"

[pref.dir_jumper.targets.zsh_live]
target = "zsh_live"
key = "functions"
accumulate = true
want_any = "__zoxide_z"

[pref.autosuggestions]
value = "atuin's store ghosts the rest of the command"
why = "The cheapest possible recall: the suggestion is already typed, accepting it is one keystroke. The plugin is the SOLE implementation — zshzle's POSTDISPLAY is the paint primitive it rides, but zsh 5.9 ships no native suggestion engine, so if upstream dies the taste has no fallback (ruled from the 27-08-2026 sweep). The SOURCE is atuin's store, not zsh's in-memory history: atuin's init sets ZSH_AUTOSUGGEST_STRATEGY=(atuin) — in its script since 18.19 at least — so this has been live since atuin was adopted and recorded nowhere until 02-09-2026; kept, because one store then answers both Ctrl+R and the ghost text."

# Live because the gate is a guarded `[ -f ... ] && source` line whose first
# word is `[` — text cannot see it; the widget existing is the honest test.
[pref.autosuggestions.targets.zsh_live]
key = "widgets"
accumulate = true
want_any_contain = "autosuggest-accept"

# The source, pinned live: a tool init that stops setting it, or a managed
# line forcing (history), changes what the ghost text is drawn from with
# no widget going away.
[pref.autosuggestions.targets.zsh_live_source]
target = "zsh_live"
key = "params"
accumulate = true
want_any = "ZSH_AUTOSUGGEST_STRATEGY=atuin"

# Widgets bound once at the first prompt instead of re-wrapped on every
# precmd — upstream's own lever, 7 ms per prompt (20 rebinds in 142 ms,
# 02-09-2026). Safe because nothing creates a widget after z-sy-h, which
# preen doctor's ordering check owns; a plugin sourced below it anyway would
# need a manual `_zsh_autosuggest_bind_widgets`.
[pref.autosuggestions.targets.zshrc_manual_rebind]
target = "zshrc"
key = "ZSH_AUTOSUGGEST_MANUAL_REBIND"
want = "1"

[pref.autosuggestions.targets.zsh_live_manual_rebind]
target = "zsh_live"
key = "params"
accumulate = true
want_any = "ZSH_AUTOSUGGEST_MANUAL_REBIND=1"

[pref.syntax_highlighting]
value = "an unknown command turns red before Enter"
why = "Errors caught at the prompt cost nothing; the same mistake after Enter costs a round trip. Must be sourced LAST (upstream rule) — preen doctor's semantic check owns the ordering half. Sole implementation: zshzle's highlight contexts do not include command validity, and region_highlight — exactly what z-sy-h drives — is the only route (ruled from the 27-08-2026 sweep)."

[pref.syntax_highlighting.targets.zsh_live]
key = "widgets"
accumulate = true
want_any_contain = "_zsh_highlight"

# Two highlighters beside main, adopted 02-09-2026: brackets colours each
# bracket by nesting level and marks the one matching the cursor — the
# visible-guides taste at the prompt; pattern paints one shape red before
# Enter — the NO_CLOBBER file-safety family. Text pins the list and the
# pattern; live pins the list the plugin actually consults.
[pref.syntax_highlighting.targets.zshrc_brackets]
target = "zshrc"
key = "ZSH_HIGHLIGHT_HIGHLIGHTERS"
want_contains = "brackets"

[pref.syntax_highlighting.targets.zshrc_pattern]
target = "zshrc"
key = "ZSH_HIGHLIGHT_HIGHLIGHTERS"
want_contains = "pattern"

[pref.syntax_highlighting.targets.zshrc_rm_pattern]
target = "zshrc"
key = "ZSH_HIGHLIGHT_PATTERNS+"
want_contains = "rm -rf"

[pref.syntax_highlighting.targets.zsh_live_highlighters]
target = "zsh_live"
key = "params"
accumulate = true
want_any = "ZSH_HIGHLIGHT_HIGHLIGHTERS=main brackets pattern"

[pref.completion_style]
value = "menu-select, case-insensitive, coloured by file type in the terminal's 16 colours"
why = "Completion is a picker, not a guessing game: navigate candidates visually, match regardless of case, colour by file type. The colour codes live on the zstyle itself — an exported LS_COLORS would override eza's richer built-ins (this value said 'LS_COLORS-coloured' until 27-08-2026, when the variable turned out empty live — never set by any managed file)."

[pref.completion_style.targets.zshrc]
key = "zstyle"
accumulate = true
want_any_contain = "menu select"

[pref.completion_style.targets.zshrc_case]
target = "zshrc"
key = "zstyle"
accumulate = true
want_any_contain = "m:{a-zA-Z}={A-Za-z}"

# Anchored on the first colour code, not just the directive name — the bare
# "list-colors" match was vacuously green over an empty ${(s.:.)LS_COLORS}
# expansion until 27-08-2026. The live twin reads the RESOLVED style, so a
# .local overlay clearing it fails the check the text half cannot see.
[pref.completion_style.targets.zshrc_colors]
target = "zshrc"
key = "zstyle"
accumulate = true
want_any_contain = "list-colors 'di=01;34"

[pref.completion_style.targets.zsh_live_colors]
target = "zsh_live"
key = "zstyle"
accumulate = true
want_any_contain = "di=01;34"

# Labelled sections, a deterministic no-match message, immediate completion
# of freshly installed commands, and both-ends mid-word completion — the
# 27-08-2026 zshcompsys/zshoptions adoptions.
[pref.completion_style.targets.zshrc_groups]
target = "zshrc"
key = "zstyle"
accumulate = true
want_any_contain = "group-name ''"

[pref.completion_style.targets.zshrc_nomatch]
target = "zshrc"
key = "zstyle"
accumulate = true
want_any_contain = "no matches: %d"

[pref.completion_style.targets.zshrc_rehash]
target = "zshrc"
key = "zstyle"
accumulate = true
want_any_contain = "rehash true"

[pref.completion_style.targets.zshrc_to_end]
target = "zshrc"
key = "setopt"
accumulate = true
want_any = "ALWAYS_TO_END"

[pref.completion_style.targets.zshrc_in_word]
target = "zshrc"
key = "setopt"
accumulate = true
want_any = "COMPLETE_IN_WORD"

# ssh <TAB> offers the hosts ~/.ssh/config names (8 at the 03-08-2026
# measurement), not 129 macOS daemon accounts —
# measured 03-08-2026 (preferences.md § Interaction carries the numbers). Two zstyles
# because two completers contribute candidates; asserted separately so a
# "cleanup" of either one fails alone. Set since 06-08-2026, asserted
# 27-08-2026.
[pref.completion_style.targets.zshrc_ssh_users]
target = "zshrc"
key = "zstyle"
accumulate = true
want_any_contain = "ignored-patterns '_*'"

[pref.completion_style.targets.zshrc_ssh_hosts]
target = "zshrc"
key = "zstyle"
accumulate = true
want_any_contain = "hosts $_ssh_config_hosts"

# The text row above holds with the list EMPTY: on 17-09-2026 the named hosts
# moved to ~/.ssh/config.local, the parse still read ~/.ssh/config alone, and
# the style resolved to no hosts — completion off, every row green. The live
# row that catches it names a host's first ssh alias, so it is the host's:
# hosts/mac/preferences.toml, zsh_live_ssh_hosts.

# The 02-09-2026 adoptions (zshcompsys, third pass). Shift+Tab walks the
# menu backwards in BOTH keymaps — kitty sends ESC [ Z (terminfo kcbt), and
# the menuselect keymap ships with only Tab, Enter and the arrows; the live
# probe prints that keymap beside main so each binding is proven where it
# lives. Partial-word matching: `f.b` reaches foo.bar, case-insensitively
# still, because specs are tried in turn rather than merged. Directories
# ahead of files, `//` read as one path, an existing directory prefix
# accepted without re-scanning its parents, and a position line when a
# menu outgrows the screen.
# Exact, because the menuselect line below repeats this text after `-M
# menuselect` — a substring match on the main-keymap binding survived the
# battery's rebinding of it.
[pref.completion_style.targets.zshrc_shift_tab]
target = "zshrc"
key = "bindkey"
accumulate = true
want_any = "'^[[Z' reverse-menu-complete"

[pref.completion_style.targets.zshrc_shift_tab_menu]
target = "zshrc"
key = "bindkey"
accumulate = true
want_any_contain = "-M menuselect '^[[Z' reverse-menu-complete"

[pref.completion_style.targets.zsh_live_shift_tab]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any_contain = 'bindkey "^[[Z" reverse-menu-complete'

[pref.completion_style.targets.zsh_live_shift_tab_menu]
target = "zsh_live"
key = "bindkey"
accumulate = true
want_any_contain = 'bindkey -M menuselect "^[[Z" reverse-menu-complete'

[pref.completion_style.targets.zshrc_partial]
target = "zshrc"
key = "zstyle"
accumulate = true
want_any_contain = "r:|[._-]=* r:|=*"

[pref.completion_style.targets.zsh_live_partial]
target = "zsh_live"
key = "zstyle"
accumulate = true
want_any_contain = "r:|[._-]=* r:|=*"

[pref.completion_style.targets.zshrc_dirs_first]
target = "zshrc"
key = "zstyle"
accumulate = true
want_any_contain = "list-dirs-first true"

[pref.completion_style.targets.zsh_live_dirs_first]
target = "zsh_live"
key = "zstyle"
accumulate = true
want_any_contain = "list-dirs-first true"

[pref.completion_style.targets.zshrc_squeeze]
target = "zshrc"
key = "zstyle"
accumulate = true
want_any_contain = "squeeze-slashes true"

[pref.completion_style.targets.zshrc_exact_dirs]
target = "zshrc"
key = "zstyle"
accumulate = true
want_any_contain = "accept-exact-dirs true"

[pref.completion_style.targets.zshrc_select_prompt]
target = "zshrc"
key = "zstyle"
accumulate = true
want_any_contain = "select-prompt '%SScrolling active"

[pref.completion_style.targets.zshrc_descriptions]
target = "zshrc"
key = "zstyle"
accumulate = true
want_any_contain = "descriptions' format '%B%d%b'"

[pref.completion_style.targets.zsh_live_descriptions]
target = "zsh_live"
key = "zstyle"
accumulate = true
# `zstyle -L` re-quotes by need: this value has no space, so the resolved
# form drops the quotes the file writes — unlike the warnings format beside
# it, which keeps them. The two readers see the same directive differently.
want_any_contain = "descriptions' format %B%d%b"

[pref.completion_style.targets.inputrc_case]
target = "inputrc"
key = "completion-ignore-case"
want = "on"

[pref.completion_style.targets.inputrc_list]
target = "inputrc"
key = "show-all-if-ambiguous"
want = "on"

[pref.completion_style.targets.inputrc_dirs]
target = "inputrc"
key = "mark-symlinked-directories"
want = "on"

[pref.combining_chars]
value = "The line editor assumes the terminal composes combining characters"
why = "kitty composes e + U+0301 into é; with COMBINING_CHARS unset zle draws a reverse-video <0301> in its place and the composed glyph never appears — measured through a PTY on a Linux host 09-09-2026. The Mac gets the option from Apple's /etc/zshrc, so its live probe is the assertion there; a host whose system zshrc does not set it sets it in its own overlay."

[pref.combining_chars.targets.zsh_live]
target = "zsh_live"
key = "setopt"
accumulate = true
want_any = "combiningchars"

[pref.editor_env]
value = "EDITOR is a real editor — zed --wait locally, nano over SSH"
why = "Non-modal per the criteria; the fallback is nano deliberately NOT vi, so the headless case cannot land in modal editing either. Text asserts both branches exist; live asserts this machine resolves the GUI one."

[pref.editor_env.targets.zshenv]
key = "EDITOR"
accumulate = true
want_any_contain = "nano"

[pref.editor_env.targets.zshenv_gui]
target = "zshenv"
key = "EDITOR"
accumulate = true
want_any_contain = "zed --wait"

[pref.editor_env.targets.zsh_live]
key = "params"
accumulate = true
want_any_contain = "EDITOR=zed --wait"

# VISUAL outranks EDITOR in most lookup chains (git, less's v, crontab), so a
# diverged VISUAL would route around everything above while it stayed green.
# The mirror is the gate.
[pref.editor_env.targets.zshenv_visual]
target = "zshenv"
key = "VISUAL"
want = "$EDITOR"

[pref.editor_env.targets.zsh_live_visual]
target = "zsh_live"
key = "params"
accumulate = true
want_any = "VISUAL=zed --wait"

[pref.editor_env.targets.mac_nano_is_pico]
state = "unreachable"
recheck = "auto"
target = "zshenv"
evidence = "the SSH/headless branch names nano, and macOS ships /usr/bin/nano as a symlink to /usr/bin/pico — UW PICO 5.09, which reads no rc file, so none of the nano taste asserted on a host that has the real one can reach this machine"
probe = "mac_nano_is_pico"

[pref.secrets_placement]
