# Gruvbox Dark Hard — Starship prompt
# A curated allowlist, not $all — a module absent here can never render.
# git_state shows a rebase or merge in progress, kotlin and gradle name the
# work stack beside java, and jobs shows backgrounded work. git_commit: on a
# detached HEAD git_branch renders the word "HEAD" and never says which
# commit; only_detached is its default, so it is silent on a branch.
#
# Two lines: context above, a bare ❯ below, so the width left for typing
# never depends on the directory or the branch. $fill pushes the toolchain to
# the right margin — where you are on the left, what you run with on the
# right. The context line does the blank line's separating job, so
# add_newline is off and the prompt costs two rows, the same as one line plus
# a blank.
add_newline = false
format = "$username$directory$git_branch$git_commit$git_state$git_status$fill$python$java$kotlin$gradle$rust$nodejs$jobs$cmd_duration$line_break$character"

[fill]
symbol = " "

[cmd_duration]
min_time = 2000
format = "[⌛ $duration]($style) "
style = "bold #fabd2f"

[username]
format = "[$user]($style) "
style_user = "bold #fabd2f"
style_root = "bold #fb4934"
show_always = true

[directory]
format = "[$path]($style) "
# false: name the directory the process is IN, not $PWD. cship runs starship
# with cwd = the session's directory but inherits claude's launch-time $PWD, so
# a worktree session named the launch directory on line 1 (02-09-2026). Where
# no project path is a symlink, the shell prompt is unaffected.
use_logical_path = false
style = "bold #ebdbb2"
truncation_length = 3

[character]
success_symbol = "[❯](bold #b8bb26)"
error_symbol = "[❯](bold #fb4934)"

# Icons are the separators — no "on", no "via". A version shows the digits a
# decision turns on: the major for the JDK and Node, major.minor for Gradle,
# Python and Rust. cship's statusline line 1 renders these same formats.
[git_branch]
format = "[$symbol$branch]($style) "
style = "bold #8ec07c"

[git_status]
style = "#fabd2f"

[python]
format = "[$symbol($version)]($style) "
version_format = "${major}.${minor}"
style = "#83a598"

[java]
format = "[$symbol($version)]($style) "
version_format = "${major}"
style = "#fb4934"

# Badge only. starship reads the version from `kotlinc`; this machine's Kotlin
# is Gradle's embedded compiler — a recorded ceiling.
[kotlin]
format = "[$symbol]($style)"

[gradle]
format = "[$symbol($version)]($style) "
version_format = "${major}.${minor}"

[rust]
format = "[$symbol($version)]($style) "
version_format = "${major}.${minor}"
style = "#fe8019"

[nodejs]
format = "[$symbol($version)]($style) "
version_format = "${major}"
style = "#b8bb26"
